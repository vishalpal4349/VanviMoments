<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem('vanvi_aesthetic_theme')||'clay';var f=localStorage.getItem('vanvi_font_pref')||'royal';document.documentElement.setAttribute('data-vanvi-theme',t);document.documentElement.setAttribute('data-vanvi-font',f);}catch(e){}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title id="pageTitle">Live Template Preview | Vanvi Moments</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/vanvi-global-experience.css">
  <link rel="stylesheet" href="vanvi-inner-light.css">
  <script src="js/vanvi-templates-data.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000000;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* 100% Full Viewport Native Template Frame - NO FAKE FRAMES OR MOCKUPS */
    .template-fullscreen-viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
      background: transparent;
      z-index: 1;
    }

    /* Minimal Non-Intrusive Floating Top Action Pill */
    .vanvi-preview-top-dock {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      background: rgba(18, 12, 22, 0.85);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
      border-radius: 999px;
      padding: 5px 8px 5px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #ffffff;
      font-size: 13px;
      max-width: calc(100vw - 24px);
      pointer-events: auto;
      user-select: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .preview-pill-back {
      color: #f1f5f9;
      text-decoration: none;
      font-weight: 750;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: color 0.2s;
      white-space: nowrap;
      font-size: 12.5px;
    }
    .preview-pill-back:hover {
      color: #ff2a7a;
    }

    .preview-pill-sep {
      width: 1px;
      height: 14px;
      background: rgba(255, 255, 255, 0.25);
    }

    .preview-pill-name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
      color: #ffffff;
      font-size: 12.5px;
    }

    .preview-pill-price {
      font-weight: 850;
      color: #ffd8d0;
      white-space: nowrap;
      font-size: 12.5px;
    }

    .preview-pill-cta {
      background: linear-gradient(135deg, #ff2a7a 0%, #e11d68 100%);
      color: #ffffff !important;
      font-weight: 800;
      font-size: 12px;
      text-decoration: none;
      padding: 6px 18px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(255, 42, 122, 0.4);
      transition: all 0.2s ease;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.4);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .preview-pill-cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(255, 42, 122, 0.6);
      background: linear-gradient(135deg, #ff438b 0%, #f01e74 100%);
    }

    /* Mobile: 100% natural mobile screen with sleek compact pill */
    @media (max-width: 540px) {
      .vanvi-preview-top-dock {
        top: 10px;
        gap: 8px;
        padding: 4px 6px 4px 12px;
      }
      .preview-pill-name {
        display: none;
      }
      .preview-pill-cta {
        padding: 5px 14px;
        font-size: 11.5px;
      }
    }
    body { overflow-x: hidden; }
</style>
  <link rel="stylesheet" href="vanvi-navigation.css">
</head>
<body>

  <!-- Minimal Floating Navigation Pill -->
  <header class="vanvi-preview-top-dock" role="banner" aria-label="Preview Navigation">
    <a href="templates.html" class="preview-pill-back" title="Back to Templates Catalog">
      <span>←</span>
      <span>Catalog</span>
    </a>
    <span class="preview-pill-sep"></span>
    <span class="preview-pill-name" id="previewTitle">Template Preview</span>
    <span class="preview-pill-price" id="previewPrice"></span>
    <a href="builder.html" class="preview-pill-cta" id="previewCreateBtn" title="Create with this template">
      Create
    </a>
  </header>

  <!-- 100% Real Template Experience Loaded in Full Viewport -->
  <iframe src="about:blank" class="template-fullscreen-viewport" id="previewIframe" title="Live Fullscreen Preview"></iframe>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      let tplId = params.get('template') || params.get('id') || params.get('t') || 'birthday-3d-candle';

      // Fallback aliases
      const aliasMap = {
        'mandapam-royale': 'temple-royal-wedding',
        'sacred-temple-wedding': 'temple-royal-wedding',
        'botanical-blush': 'botanical-blush-wedding',
        'maison-rose': 'botanical-blush-wedding',
        'bday-candle-3d': 'birthday-3d-candle',
        'bday-wish-1': 'birthday-wish-01',
        'bday-wish-2': 'birthday-wish-02',
        'love': 'constellation-love',
        'anniversary': 'golden-anniversary',
        'polaroid': 'retro-polaroid-wall',
        'apology': 'sincere-letter',
        'royal-vivah': 'royal-vivah-palace',
        'shaadipath-template01': 'royal-vivah-palace',
        'template01': 'royal-vivah-palace',
        'vanvi-royal-vivah-01': 'royal-vivah-palace',
        'royal-palace-heritage': 'royal-vivah-palace',
        'std-03-mirror-reveal': 'mirror-reveal',
        'std-03': 'mirror-reveal',
        'mirror-save-the-date': 'mirror-reveal',
        'wedding': 'temple-royal-wedding'
      };
      if (aliasMap[tplId]) tplId = aliasMap[tplId];

      let name = 'Keepsake Experience';
      let priceText = '';
      let targetPath = `templates/${tplId}/index.html?preview=1`;

      if (window.VanviTemplatesData && typeof window.VanviTemplatesData.getById === 'function') {
        const found = window.VanviTemplatesData.getById(tplId);
        if (found) {
          name = found.name;
          const p = Number(found.price || 0);
          priceText = p === 0 ? 'Free' : `₹${p}`;
          if (found.templatePath) {
            targetPath = `${found.templatePath}?preview=1`;
          }
        }
      }

      document.title = `Preview: ${name} | Vanvi Moments`;
      document.getElementById('previewTitle').textContent = name;
      document.getElementById('previewPrice').textContent = priceText;
      document.getElementById('previewCreateBtn').href = `builder.html?template=${encodeURIComponent(tplId)}`;

      const iframe = document.getElementById('previewIframe');
      iframe.src = targetPath;
    })();
  </script>
  <script src="js/vanvi-navigation.js"></script>
</body>
</html>
