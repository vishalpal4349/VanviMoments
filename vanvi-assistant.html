<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem('vanvi_aesthetic_theme')||'clay';var f=localStorage.getItem('vanvi_font_pref')||'royal';document.documentElement.setAttribute('data-vanvi-theme',t);document.documentElement.setAttribute('data-vanvi-font',f);}catch(e){}})();</script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, interactive-widget=resizes-content"/>
  <title>Vanvi AI — Intelligent Creative Companion ✨</title>
  <meta name="description" content="Meet Vanvi AI, your ultra-smart, heartfelt celebration companion. Crafted with soft tactile claymorphic aesthetics, frosted glass elegance, and Google Gemini intelligence."/>
  <meta name="theme-color" content="#fff8fb"/>

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg"/>

  <!-- Google Fonts: Plus Jakarta Sans, Outfit, Cormorant Garamond, Caveat, Cinzel, Playfair Display & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  
  <link rel="stylesheet" href="vanvi-inner-light.css"/>
  <link rel="stylesheet" href="vanvi-navigation.css"/>
  <link rel="stylesheet" href="css/vanvi-global-experience.css" />

  <style>
    /* ==========================================================================
       VANVI AI: LIGHT-FIRST CLAYMORPHISM & FROSTED GLASS PALETTE
       Colors: Pearl White, Soft Blush, Petal Rose, Soft Lilac/Lavender, Champagne
       ========================================================================== */
    :root {
      --bg-canvas: #fcf9fb;
      --bg-ambient: radial-gradient(at 10% 12%, rgba(255, 230, 242, 0.75) 0px, transparent 55%),
                    radial-gradient(at 88% 85%, rgba(243, 232, 255, 0.65) 0px, transparent 50%),
                    radial-gradient(at 50% 50%, #ffffff 0%, #fff7fa 100%);
      
      --c-text-primary: #291223;
      --c-text-muted: #6e4a64;
      --c-text-subtle: #9a7891;

      --clay-white: #ffffff;
      --clay-rose: #ff2a7a;
      --clay-lilac: #8b5cf6;
      --clay-gold: #d97706;

      /* Soft Claymorphic Specular & Shadow Physics */
      --clay-shadow-soft: 
        0 14px 28px -4px rgba(41, 18, 35, 0.05),
        0 4px 12px rgba(255, 42, 122, 0.04),
        inset 0 1px 1.5px rgba(255, 255, 255, 0.95),
        inset 0 -2px 4px rgba(255, 120, 175, 0.08);

      --clay-shadow-card:
        0 18px 36px -6px rgba(41, 18, 35, 0.06),
        0 6px 16px rgba(255, 42, 122, 0.05),
        inset 0 2px 2px rgba(255, 255, 255, 1),
        inset 0 -3px 6px rgba(255, 100, 160, 0.08);

      --clay-shadow-pill:
        0 8px 20px -2px rgba(255, 42, 122, 0.14),
        inset 0 2px 3px rgba(255, 255, 255, 0.8),
        inset 0 -2px 3px rgba(0, 0, 0, 0.1);

      --frosted-glass: rgba(255, 255, 255, 0.82);
      --border-silky: rgba(255, 160, 195, 0.28);
      --border-subtle: rgba(255, 160, 195, 0.16);

      --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100% !important;
      height: 100% !important;
      height: 100dvh !important;
      background: var(--bg-canvas) !important;
      background-image: var(--bg-ambient) !important;
      font-family: var(--font-body) !important;
      color: var(--c-text-primary) !important;
      overflow: hidden !important;
      display: flex !important;
      flex-direction: column !important;
      position: relative !important;
      margin: 0 !important;
      padding: 0 !important;
      padding-bottom: 0 !important;
    }

    /* Never allow global bottom nav dock to take space or appear on assistant */
    .vanvi-bottom-dock,
    .bottom.vanvi-bottom-dock,
    nav.bottom {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
      height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Ambient Gentle Light Glows in Corners */
    .ambient-glow-blush {
      position: fixed;
      top: -100px;
      right: -80px;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 140, 190, 0.35) 0%, rgba(255, 210, 230, 0) 70%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 0;
    }
    .ambient-glow-lavender {
      position: fixed;
      bottom: 40px;
      left: -90px;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200, 180, 255, 0.32) 0%, rgba(230, 220, 255, 0) 70%);
      filter: blur(45px);
      pointer-events: none;
      z-index: 0;
    }

    /* ==========================================================================
       HEADER: SOFT FROSTED CLAY ATELIER BAR
       ========================================================================== */
    .ai-header {
      position: relative;
      z-index: 40;
      height: 64px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--frosted-glass);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-bottom: 1px solid var(--border-subtle);
      box-shadow: 0 2px 12px rgba(41, 18, 35, 0.02);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    /* Sleek Compact Back Button */
    .btn-tactile-back {
      height: 32px;
      padding: 0 11px;
      border-radius: 99px;
      border: 1px solid var(--border-silky);
      background: #ffffff;
      color: var(--c-text-primary);
      text-decoration: none;
      font-size: 12px;
      font-weight: 750;
      display: inline-flex;
      align-items: center;
      gap: 3.5px;
      box-shadow: var(--clay-shadow-soft);
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex-shrink: 0;
    }
    .btn-tactile-back:hover {
      transform: translateY(-1px);
      border-color: var(--clay-rose);
      color: var(--clay-rose);
      box-shadow: 0 6px 14px rgba(255, 42, 122, 0.16);
    }
    .btn-tactile-back:active {
      transform: scale(0.95);
    }

    /* AI Identity Block */
    .ai-identity-block {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      user-select: none;
    }

    /* ─── CUTE LIVE 3D PANDA AVATAR & BRAND LOCK ─── */
    .ai-header,
    .ai-header * {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif !important;
    }

    .orb-capsule {
      position: relative;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .vanvi-orb-3d {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      background: linear-gradient(145deg, #ffffff 0%, #fff2f7 50%, #ffeaf3 100%);
      border: 1.5px solid rgba(255, 140, 185, 0.45);
      box-shadow: 
        0 6px 16px -2px rgba(255, 42, 122, 0.22),
        inset 0 2px 3px #ffffff,
        inset 0 -2px 3px rgba(255, 120, 175, 0.15);
      display: grid;
      place-items: center;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      padding: 2.5px;
      overflow: visible;
    }
    .vanvi-orb-3d:hover {
      transform: scale(1.1) rotate(-4deg);
      border-color: var(--clay-rose);
    }
    .vanvi-orb-3d:active,
    .vanvi-orb-3d.cheer {
      animation: pandaCheerJump 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    }
    @keyframes pandaCheerJump {
      0% { transform: scale(1) translateY(0); }
      30% { transform: scale(1.22) translateY(-6px) rotate(-8deg); }
      60% { transform: scale(1.15) translateY(-2px) rotate(6deg); }
      100% { transform: scale(1) translateY(0) rotate(0deg); }
    }

    /* Orb Halo Ambient Breathe */
    .orb-halo-breathe {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 42, 122, 0.28) 0%, rgba(139, 92, 246, 0.15) 60%, transparent 75%);
      filter: blur(5px);
      pointer-events: none;
      animation: orbGlowFloat 4s ease-in-out infinite alternate;
    }
    @keyframes orbGlowFloat {
      0% { transform: scale(0.92); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    /* Panda Micro-Animation States (Idle, Thinking, Responding) */
    .vanvi-orb-3d.state-idle {
      animation: orbSoftFloat 4s ease-in-out infinite alternate;
    }
    @keyframes orbSoftFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-2.5px); }
    }

    .vanvi-orb-3d.state-thinking {
      background: linear-gradient(145deg, #fff3f9 0%, #ffe3f1 50%, #f3e8ff 100%);
      box-shadow: 0 8px 24px rgba(255, 42, 122, 0.35), inset 0 2px 3px #ffffff;
      animation: orbWarmPulse 1.8s infinite ease-in-out;
    }
    @keyframes orbWarmPulse {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.08); filter: brightness(1.15); }
    }

    .vanvi-orb-3d.state-responding {
      animation: orbBreatheSpeaking 1.2s infinite ease-in-out;
    }
    @keyframes orbBreatheSpeaking {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.06); filter: brightness(1.1); }
    }

    /* Identity Details: Unbreakable Brand Lock (Never splits in ANY font or screen) */
    .ai-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
      justify-content: center;
      line-height: 1.1;
    }
    .ai-name-row {
      display: flex;
      align-items: center;
      white-space: nowrap !important;
      flex-wrap: nowrap !important;
      line-height: 1;
    }
    .ai-brand-lock {
      display: inline-flex !important;
      align-items: center !important;
      gap: 5.5px !important;
      white-space: nowrap !important;
      flex-wrap: nowrap !important;
      flex-shrink: 0 !important;
      line-height: 1 !important;
    }
    .ai-name-text {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif !important;
      font-size: 14.5px;
      font-weight: 850;
      letter-spacing: -0.2px;
      color: var(--c-text-primary);
      display: inline-flex;
      align-items: center;
      gap: 3.5px;
      white-space: nowrap !important;
      line-height: 1;
    }
    .ai-name-text span {
      color: var(--clay-rose);
    }
    .clay-badge-spark {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif !important;
      font-size: 9px;
      font-weight: 850;
      color: #ffffff;
      background: linear-gradient(135deg, var(--clay-rose), var(--clay-lilac));
      padding: 2px 6.5px;
      border-radius: 99px;
      box-shadow: 0 2px 6px rgba(255, 42, 122, 0.25);
      letter-spacing: 0.2px;
      line-height: 1.2;
      flex-shrink: 0;
      white-space: nowrap !important;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .ai-status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 650;
      color: #059669;
      margin-top: 3px;
      line-height: 1;
      white-space: nowrap;
    }

    /* Cute Micro Panda Icon Styling */
    .panda-avatar-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .panda-avatar-svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 2px 4px rgba(41, 18, 35, 0.12));
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .vanvi-orb-3d:hover .panda-avatar-svg,
    .msg-clay-avatar:hover .panda-avatar-svg {
      transform: scale(1.12) rotate(-4deg);
    }

    /* Panda Micro-Blinking Live Eye Physics */
    @keyframes pandaBlink {
      0%, 93%, 97%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.12); }
    }
    .panda-eye {
      transform-origin: 18px 18px;
      animation: pandaBlink 3.8s infinite ease-in-out;
    }

    /* Panda Ear Wiggle */
    @keyframes pandaEarWiggle {
      0%, 88%, 100% { transform: rotate(0deg); }
      92% { transform: rotate(-8deg); }
      95% { transform: rotate(6deg); }
    }
    .panda-ear-left {
      transform-origin: 10px 10px;
      animation: pandaEarWiggle 4.6s infinite ease-in-out;
    }
    .panda-ear-right {
      transform-origin: 26px 10px;
      animation: pandaEarWiggle 4.6s infinite ease-in-out 0.2s;
    }
    .pulse-dot-green {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 7px #10b981;
      animation: dotAlive 2s infinite ease-in-out;
    }
    @keyframes dotAlive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.8); }
    }

    /* Header Actions */
    .header-right-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-clay-icon {
      width: 38px;
      height: 38px;
      border-radius: 99px;
      border: 1px solid var(--border-silky);
      background: #ffffff;
      color: var(--c-text-muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: var(--clay-shadow-soft);
      font-size: 14px;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-clay-icon:hover {
      transform: translateY(-1.5px);
      border-color: var(--clay-rose);
      color: var(--clay-rose);
      box-shadow: 0 8px 18px rgba(255, 42, 122, 0.16);
    }
    .btn-clay-icon:active {
      transform: scale(0.95);
    }

    /* ==========================================================================
       CONVERSATION VIEWPORT & SCROLL AREA
       ========================================================================== */
    .chat-workspace {
      position: relative;
      z-index: 10;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
      width: 100%;
    }

    .conversation-feed {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 16px calc(92px + env(safe-area-inset-bottom, 14px)) !important;
      display: flex;
      flex-direction: column;
      gap: 14px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }
    .chat-bottom-anchor {
      height: 1px;
      width: 100%;
      flex-shrink: 0;
      pointer-events: none;
      visibility: hidden;
    }
    .conversation-feed::-webkit-scrollbar {
      width: 5px;
    }
    .conversation-feed::-webkit-scrollbar-thumb {
      background: rgba(255, 120, 175, 0.22);
      border-radius: 99px;
    }

    /* ─── CLAYMORPHIC HERO WELCOME CARD (COMPACT & LUXURY) ─── */
    .hero-welcome-clay {
      background: var(--frosted-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.2px solid rgba(255, 255, 255, 0.9);
      border-radius: 22px;
      padding: 18px 16px 16px;
      text-align: center;
      box-shadow: var(--clay-shadow-card);
      margin: 6px auto 10px;
      max-width: 460px;
      width: 100%;
      animation: welcomeFloatIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    @keyframes welcomeFloatIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Compact 3D Clay Orb with Cute Baby Panda */
    .hero-large-orb-box {
      width: 60px;
      height: 60px;
      margin: 0 auto 10px;
      position: relative;
    }
    .hero-large-orb {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffffff 0%, #fff2f7 50%, #ffeaf3 100%);
      border: 2px solid rgba(255, 140, 185, 0.45);
      box-shadow: 
        0 10px 24px -2px rgba(255, 42, 122, 0.22),
        inset 0 3px 4px #ffffff,
        inset 0 -3px 5px rgba(255, 120, 175, 0.12);
      display: grid;
      place-items: center;
      padding: 3.5px;
      animation: heroOrbBreathe 3.8s ease-in-out infinite alternate;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .hero-large-orb:hover {
      transform: scale(1.12) rotate(6deg);
      border-color: var(--clay-rose);
    }
    .hero-large-orb:active,
    .hero-large-orb.cheer {
      animation: pandaCheerJump 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    }
    @keyframes heroOrbBreathe {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-3px) scale(1.04); }
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: 21px;
      font-weight: 700;
      color: var(--c-text-primary);
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }
    .hero-title span {
      background: linear-gradient(135deg, var(--clay-rose), var(--clay-lilac));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-description {
      font-size: 12.5px;
      color: var(--c-text-muted);
      line-height: 1.5;
      margin-bottom: 14px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Starter Compact Clay Chips Grid (Zero clutter, fit perfectly on mobile) */
    .starters-clay-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }
    .btn-clay-starter {
      padding: 8.5px 11px;
      border-radius: 99px;
      background: #ffffff;
      border: 1px solid var(--border-silky);
      color: var(--c-text-primary);
      font-size: 11.5px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--clay-shadow-soft);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-clay-starter span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-clay-starter:hover {
      transform: translateY(-1.5px);
      border-color: var(--clay-rose);
      color: var(--clay-rose);
      box-shadow: 0 6px 16px rgba(255, 42, 122, 0.16);
    }
    .btn-clay-starter:active {
      transform: scale(0.96);
    }

    /* ==========================================================================
       CHAT MESSAGES: USER & AI CLAY BUBBLES
       ========================================================================== */
    .msg-group {
      display: flex;
      gap: 10px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      animation: messageSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes messageSlideIn {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .msg-group.user {
      justify-content: flex-end;
    }
    .msg-group.ai {
      justify-content: flex-start;
    }

    .msg-clay-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 15px;
      box-shadow: var(--clay-shadow-soft);
      margin-top: 2px;
      position: relative;
    }
    .msg-group.ai .msg-clay-avatar {
      background: linear-gradient(145deg, #ffffff 0%, #fff2f7 50%, #ffeaf3 100%);
      border: 1.2px solid rgba(255, 140, 185, 0.4);
      box-shadow: 0 4px 14px rgba(255, 42, 122, 0.16), inset 0 1.5px 2px #fff;
      padding: 2px;
      overflow: visible;
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .msg-group.ai .msg-clay-avatar:hover {
      transform: scale(1.15) rotate(5deg);
    }
    .msg-group.user .msg-clay-avatar {
      background: #ffffff;
      border: 1px solid var(--border-silky);
      color: var(--c-text-muted);
      order: 2;
    }

    .msg-content-wrapper {
      display: flex;
      flex-direction: column;
      max-width: min(82%, 520px);
    }
    .msg-group.user .msg-content-wrapper {
      align-items: flex-end;
    }

    .clay-bubble {
      padding: 11px 16px;
      font-size: 14px;
      line-height: 1.56;
      word-break: break-word;
      position: relative;
      max-width: 100%;
    }

    /* ==========================================================================
       5 LUXURY UNIVERSAL FONTS (REAL WORKING ENGINE)
       1. Royal Atelier (Cormorant Garamond + Plus Jakarta Sans)
       2. Romantic Handwritten (Caveat Cursive)
       3. Modern Minimal (Outfit Geometric)
       4. Editorial Vogue (Playfair Display + Inter)
       5. Imperial Majestic (Cinzel Classic Roman)
       ========================================================================== */

    /* 1. Royal Atelier (Default) */
    html[data-vanvi-font="royal"] body,
    html[data-vanvi-font="royal"] .clay-bubble,
    html[data-vanvi-font="royal"] .composer-input,
    body.font-royal body,
    body.font-royal .clay-bubble {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif !important;
    }

          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');

            top: scrollHeight,

          <div class="msg-clay-avatar" onclick="triggerPandaCheer()" title="Vanvi Baby Panda">${PANDA_AVATAR_HTML}</div>
          <div class="msg-content-wrapper">
            <div class="vanvi-micro-thinking-pill">
              <span class="panda-mini-avatar">🐼</span>
              <span class="thinking-pill-text">Panda is thinking… ✨</span>
              <div class="micro-typing-dots">
                <span class="micro-dot"></span>
                <span class="micro-dot"></span>
                <span class="micro-dot"></span>
              </div>
            </div>
          </div>
        `;
        appendToFeed(row);
        scrollToBottom(true);
      }

      function hideTyping() {
        const el = document.getElementById('typingBubble');
        if (el) el.remove();
      }

      // Natural Streaming Response with Throttled Auto-Scroll
      async function streamAiResponse(fullText, suggestions = [], action = null) {
        setOrbState('responding');
        const row = document.createElement('div');
        row.className = 'msg-group ai';
        const msgId = 'msg_' + Date.now();

        let actionHtml = '';
        if (action && action.label && action.url) {
          actionHtml = `<a href="${escapeHtml(action.url)}" class="btn-bubble-tool">✦ ${escapeHtml(action.label)}</a>`;
        }

        let suggHtml = '';
        if (Array.isArray(suggestions) && suggestions.length > 0) {
          const chips = suggestions.slice(0, 4).map(s => {
            const clean = escapeHtml(s).replace(/'/g, "\\'");
            return `<button type="button" class="btn-suggestion-chip" onclick="window.sendPrompt('${clean}')">✨ ${escapeHtml(s)}</button>`;
          }).join('');
          suggHtml = `<div class="smart-suggestions-row" id="sugg_${msgId}" style="display:none;">${chips}</div>`;
        }

        row.innerHTML = `
          <div class="msg-clay-avatar" onclick="triggerPandaCheer()" title="Vanvi Baby Panda">${PANDA_AVATAR_HTML}</div>
          <div class="msg-content-wrapper">
            <div class="clay-bubble" id="${msgId}"></div>
            <div class="clay-bubble-actions" id="acts_${msgId}" style="display:none;">
              <button type="button" class="btn-bubble-tool" onclick="copyReply(this, \`${escapeHtml(fullText).replace(/`/g, '\\`')}\`)">📋 Copy</button>
              <button type="button" class="btn-bubble-tool" onclick="shareWhatsApp(\`${escapeHtml(fullText).replace(/`/g, '\\`')}\`)">📲 WhatsApp</button>
              <button type="button" class="btn-bubble-tool" onclick="regenerateLast()">🔄 Retry</button>
              ${actionHtml}
            </div>
            ${suggHtml}
          </div>
        `;
        appendToFeed(row);

        const bubble = document.getElementById(msgId);
        const acts = document.getElementById('acts_' + msgId);
        const sugg = document.getElementById('sugg_' + msgId);

        // Word-by-word streaming with throttled smooth auto-scroll
        const tokens = fullText.split(/(?<=\s)/);
        let accumulated = '';
        for (let i = 0; i < tokens.length; i++) {
          accumulated += tokens[i];
          bubble.innerHTML = formatText(accumulated);
          if (i % 3 === 0) scrollToBottom(false);
          await new Promise(r => setTimeout(r, Math.random() * 10 + 6));
        }

        if (acts) acts.style.display = 'flex';
        if (sugg) sugg.style.display = 'flex';
        scrollToBottom(true);
        setOrbState('idle');
      }

      // --- 4. SECURE SERVER GEMINI DISPATCH & SMART LOCAL BRAIN ---
      async function handleSend() {
        if (isBusy) return;
        const text = chatInput.value.trim();
        if (!text) return;

        chatInput.value = '';
        const btnClear = document.getElementById('btnClearInput');
        if (btnClear) btnClear.style.display = 'none';
        isBusy = true;
        btnSend.disabled = true;
        if (btnSearch) btnSearch.disabled = true;
        lastUserMessage = text;

        addUserBubble(text);
        showTyping();

        let replyText = '';
        let suggestions = [];
        let action = null;

        // Direct AI Assistant Settings / Theme / Reset Control
        const lower = text.toLowerCase();
        if (/(reset|default).*(setting|theme|font|design|color|mode|aesthetics)/i.test(lower) || 
            /(setting|theme|font|design).*(reset|default)/i.test(lower) ||
            /(sab|sb).*(reset|pehle jaisa|normal kar do|default)/i.test(lower)) {
          if (typeof window.vanviResetAesthetics === 'function') {
            window.vanviResetAesthetics();
          } else {
            localStorage.setItem('vanvi_aesthetic_theme', 'clay');
            localStorage.setItem('vanvi_font_pref', 'royal');
            document.documentElement.setAttribute('data-vanvi-theme', 'clay');
            document.documentElement.setAttribute('data-vanvi-font', 'royal');
          }
          replyText = "Hazaaron khushiyon ke sath maine website ki saari settings reset kar di hain! ✨ Theme ko **Day Bloom (Signature Rose)** aur Typography ko **Royal Atelier (Recommended)** par restore kar diya gaya hai.";
          suggestions = ["Emerald Night theme lagao 🌲", "Templates dikhao 🌸", "Ek romantic wish likho 💖"];
        } else if (/(dark mode|night mode|emerald|green theme|dark theme|black theme)/i.test(lower)) {
          if (typeof window.setVanviTheme === 'function') {
            window.setVanviTheme('emerald');
          } else {
            localStorage.setItem('vanvi_aesthetic_theme', 'emerald');
            document.documentElement.setAttribute('data-vanvi-theme', 'emerald');
          }
          replyText = "Maine **Emerald Night** luxury theme activate kar diya hai! 🌲 Obsidian (#0B0D0C), Deep Emerald, Champagne Gold aur Mint accents poori website par apply ho gaye hain.";
          suggestions = ["Day Bloom theme wapas lagao 🌸", "Settings reset karo ↺", "Templates dekho ✨"];
        } else if (/(light mode|day mode|normal mode|pink theme|normal theme|white theme)/i.test(lower)) {
          if (typeof window.setVanviTheme === 'function') {
            window.setVanviTheme('clay');
          } else {
            localStorage.setItem('vanvi_aesthetic_theme', 'clay');
            document.documentElement.setAttribute('data-vanvi-theme', 'clay');
          }
          replyText = "Maine **Day Bloom** signature theme activate kar diya hai! 🌸 Soft rose blush aur frosted glass aesthetics apply ho chuke hain.";
          suggestions = ["Emerald Night lagao 🌲", "Settings reset karo ↺", "Kuch romantic suggest karo 💖"];
        }

        // Auto-detect Hindi script or Hinglish
        const isHindiScript = /[\u0900-\u097F]/.test(text) || text.toLowerCase().includes('hindi');
        const detectedLang = isHindiScript ? 'hi' : 'hinglish';

        // 1. Try unified VanviAPI SDK with fast timeout
        if (!replyText) {
          try {
            if (window.VanviAPI && window.VanviAPI.ai) {
              const res = await Promise.race([
                window.VanviAPI.ai.chat({
                  message: text,
                  history: messageHistory,
                  userContext: { source: 'vanvi-assistant-clay', lang: detectedLang }
                }),
                new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 2500))
              ]);
              if (res && res.success && res.reply) {
                replyText = res.reply;
                suggestions = res.suggestions || [];
                action = res.action || null;
              }
            }
          } catch (e) {}
        }

        // 2. Direct Backend Fetch Backup
        if (!replyText) {
          const candidateUrls = ['http://localhost:3000/api/ai/chat', 'http://127.0.0.1:3000/api/ai/chat', '/api/ai/chat'];
          for (const url of candidateUrls) {
            try {
              const fetchRes = await Promise.race([
                fetch(url, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    message: text,
                    history: messageHistory,
                    userContext: { source: 'vanvi-assistant-clay', lang: detectedLang }
                  })
                }),
                new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 2200))
              ]);
              if (fetchRes.ok) {
                const data = await fetchRes.json();
                if (data && data.success && data.reply) {
                  replyText = data.reply;
                  suggestions = data.suggestions || [];
                  action = data.action || null;
                  break;
                }
              }
            } catch (e) {}
          }
        }

        // 3. Super-Smart Instant Local Companion Brain (Guarantees Perfect Answers!)
        if (!replyText) {
          const fallback = window.generateLocalAssistantReply(text);
          replyText = fallback.reply;
          suggestions = fallback.suggestions || [];
          action = fallback.action || null;
        }

        // Add 3D thinking deliberation pause so the 3D state feels realistic and smooth
        await new Promise(r => setTimeout(r, 650));

        messageHistory.push({ role: 'user', text });
        messageHistory.push({ role: 'assistant', text: replyText });
        hideTyping();

        await streamAiResponse(replyText, suggestions, action);

        isBusy = false;
        btnSend.disabled = false;
        if (btnSearch) btnSearch.disabled = false;
        chatInput.focus();
      }

      // --- GLOBAL WINDOW HANDLERS ---
      window.sendPrompt = function(promptText) {
        if (isBusy) return;
        chatInput.value = promptText;
        handleSend();
      };

      window.regenerateLast = function() {
        if (isBusy || !lastUserMessage) return;
        chatInput.value = lastUserMessage;
        handleSend();
      };

      window.copyReply = function(btn, text) {
        if (!text) return;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(() => {
            const original = btn.innerHTML;
            btn.innerHTML = '✓ Copied!';
            setTimeout(() => { btn.innerHTML = original; }, 1800);
          });
        }
      };

      window.shareWhatsApp = function(text) {
        if (!text) return;
        const clean = String(text).replace(/<[^>]*>/g, '').trim();
        const url = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(clean + '\n\n— Crafted with Vanvi Moments AI ✨ https://vanvimoments.shop');
        window.open(url, '_blank', 'noopener,noreferrer');
      };

      window.triggerPandaCheer = function() {
        const orb = document.getElementById('aiOrbCard');
        const heroPanda = document.getElementById('heroOrbInteractive');
        if (orb) {
          orb.classList.remove('cheer');
          void orb.offsetWidth;
          orb.classList.add('cheer');
          setTimeout(() => orb.classList.remove('cheer'), 700);
        }
        if (heroPanda) {
          heroPanda.classList.remove('cheer');
          void heroPanda.offsetWidth;
          heroPanda.classList.add('cheer');
          setTimeout(() => heroPanda.classList.remove('cheer'), 700);
        }
        const sweetLines = [
          "Hehe! Vanvi is here for you! 🌸🐾",
          "Aapki smile sabse pyaari hai! 💖",
          "Aaj kisko surprise dena hai? 🎁",
          "Dil se likhenge har ek wish! 💌",
          "Yay! Main ready hoon help karne! ✨"
        ];
        const chosenLine = sweetLines[Math.floor(Math.random() * sweetLines.length)];
        if (statusText) {
          statusText.textContent = chosenLine;
          setTimeout(() => { if (statusText) statusText.textContent = 'Active'; }, 2600);
        }
      };

      window.clearConversation = function() {
        messageHistory = [];
        chatFeed.innerHTML = '';
        if (welcomeCard) {
          welcomeCard.style.display = 'block';
          chatFeed.appendChild(welcomeCard);
        }
        setOrbState('idle');
      };

      // 5 Signature Luxury Fonts Engine (Fully Functional & Synced)
      const fontOptions = [
        { key: 'royal', name: 'Royal Garamond 👑', label: 'Royal Atelier' },
        { key: 'handwritten', name: 'Romantic Handwritten 💌', label: 'Caveat Cursive' },
        { key: 'modern', name: 'Modern Outfit ✨', label: 'Modern Minimal' },
        { key: 'editorial', name: 'Editorial Vogue 📖', label: 'Playfair Display' },
        { key: 'cinzel', name: 'Imperial Cinzel 🏛️', label: 'Cinzel Roman' }
      ];

      function applyFont(fontKey, notify = false) {
        const match = fontOptions.find(f => f.key === fontKey) || fontOptions[0];
        document.documentElement.setAttribute('data-vanvi-font', match.key);
        document.body.className = 'font-' + match.key;
        try {
          localStorage.setItem('vanvi_font_pref', match.key);
          localStorage.setItem('vanvi_ai_font', match.key);
        } catch(e) {}

        if (typeof window.setVanviFont === 'function') {
          try { window.setVanviFont(match.key); } catch(e) {}
        }

        if (notify && statusText) {
          statusText.textContent = 'Font: ' + match.name;
          setTimeout(() => { if (statusText) statusText.textContent = 'Active'; }, 2200);
        }
      }

      // Restore saved font immediately
      try {
        const savedFont = localStorage.getItem('vanvi_font_pref') || localStorage.getItem('vanvi_ai_font') || 'royal';
        applyFont(savedFont, false);
      } catch(e) {}

      window.cycleTypography = function() {
        const current = document.documentElement.getAttribute('data-vanvi-font') || 'royal';
        let idx = fontOptions.findIndex(f => f.key === current);
        if (idx === -1) idx = 0;
        const nextIdx = (idx + 1) % fontOptions.length;
        const next = fontOptions[nextIdx];
        applyFont(next.key, true);

        // Micro-bounce on font button
        const btn = document.querySelector('.btn-clay-icon[title*="Font"]');
        if (btn) {
          btn.style.transform = 'scale(1.22) rotate(8deg)';
          setTimeout(() => { btn.style.transform = ''; }, 260);
        }
      };

      // Interactive Tap on Large Hero Orb
      const heroOrb = document.getElementById('heroOrbInteractive');
      if (heroOrb) {
        heroOrb.addEventListener('click', triggerPandaCheer);
      }

      window.goBack = function() {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = 'index.html';
        }
      };

      // Clear button wiring
      const btnClearInput = document.getElementById('btnClearInput');
      if (btnClearInput) {
        btnClearInput.addEventListener('click', () => {
          chatInput.value = '';
          btnClearInput.style.display = 'none';
          chatInput.focus();
        });
      }

      chatInput.addEventListener('input', () => {
        if (btnClearInput) {
          btnClearInput.style.display = chatInput.value.trim().length > 0 ? 'grid' : 'none';
        }
      });

      // Enter sends, Shift+Enter for new line
      chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      });
      btnSend.addEventListener('click', handleSend);

      // Search button interactive trigger wiring
      if (btnSearch) {
        btnSearch.addEventListener('click', () => {
          if (chatInput.value.trim().length > 0) {
            handleSend();
          } else {
            chatInput.focus();
            if (statusText) {
              statusText.textContent = 'Search or ask Vanvi… ✨';
              setTimeout(() => { if (statusText) statusText.textContent = 'Active'; }, 2000);
            }
          }
        });
      }

      // Smooth scroll on focus and resize (e.g. mobile software keyboard popping up)
      chatInput.addEventListener('focus', () => {
        setTimeout(() => scrollToBottom(true), 280);
      });
      window.addEventListener('resize', () => {
        setTimeout(() => scrollToBottom(false), 150);
      });

    })();
  </script>
  <script src="js/vanvi-navigation.js"></script>
</body>
</html>
