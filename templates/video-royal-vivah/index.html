<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Royal Vivah HD Video Invitation — Vanvi Moments</title>
  <meta name="description" content="Cinematic HD customizable wedding invitation video.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold-primary: #D4AF37;
      --gold-light: #F3E5AB;
      --gold-glow: rgba(212, 175, 55, 0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0306;
      color: #fff;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .video-container {
      width: 380px;
      max-width: 96%;
      aspect-ratio: 9 / 16;
      border-radius: 32px;
      border: 3px solid #331521;
      overflow: hidden;
      box-shadow: 0 16px 50px rgba(0,0,0,0.9), 0 0 30px var(--gold-glow);
      position: relative;
      background: #000;
    }
    #videoCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }
    .floating-audio-cta {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 5, 11, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--gold-primary);
      padding: 8px 18px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--gold-light);
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>

  <div class="video-container" onclick="togglePlay()">
    <canvas id="videoCanvas"></canvas>
    <div class="floating-audio-cta" id="tapCue">
      <span>🎵 Tap anywhere to Play &amp; Unmute</span>
    </div>
  </div>

  <script src="video-engine.js"></script>
  <script>
    let engine;
    const urlParams = new URLSearchParams(window.location.search);
    const isPaid = urlParams.get('paid') === 'true' || urlParams.get('status') === 'success';

    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('videoCanvas');
      engine = new WeddingVideoEngine(canvas, {
        duration: 45,
        watermark: !isPaid
      });

      // Try autoplay gently
      engine.drawFrame(0);
    });

    function togglePlay() {
      if (!engine) return;
      engine.togglePlay();
      document.getElementById('tapCue').style.opacity = engine.isPlaying ? '0' : '1';
    }
  </script>
</body>
</html>
