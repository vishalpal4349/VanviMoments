<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Preview — Royal Vivah HD Video Invitation | Vanvi Moments</title>
  <meta name="description" content="Cinematic 45s HD Motion Video Wedding Invitation with Ganesha shloka, royal couple introduction and auspicious muhurat.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold-primary: #D4AF37;
      --gold-light: #F3E5AB;
      --gold-glow: rgba(212, 175, 55, 0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0306;
      color: #fff;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .preview-box {
      width: 360px;
      max-width: 96%;
      aspect-ratio: 9 / 16;
      border-radius: 28px;
      border: 3px solid #331521;
      overflow: hidden;
      box-shadow: 0 16px 50px rgba(0,0,0,0.9), 0 0 30px var(--gold-glow);
      position: relative;
      background: #000;
    }
    #videoCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }
    .cta-bar {
      margin-top: 18px;
      display: flex;
      gap: 12px;
      width: 360px;
      max-width: 96%;
    }
    .btn-customize {
      flex: 1;
      background: linear-gradient(135deg, var(--gold-primary), #B8860B);
      color: #1b070f;
      text-decoration: none;
      padding: 12px;
      border-radius: 99px;
      font-weight: 800;
      font-size: 0.9rem;
      text-align: center;
      box-shadow: 0 4px 18px var(--gold-glow);
      transition: transform 0.2s;
    }
    .btn-customize:hover {
      transform: translateY(-2px);
    }
    .btn-play-toggle {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #fff;
      padding: 12px 18px;
      border-radius: 99px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="preview-box">
    <canvas id="videoCanvas"></canvas>
  </div>

  <div class="cta-bar">
    <button class="btn-play-toggle" id="btnToggle" onclick="togglePlay()">❚❚ Pause</button>
    <a href="builder.html" class="btn-customize">Customize Now (₹1,499) ✦</a>
  </div>

  <script src="video-engine.js"></script>
  <script>
    let engine;
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('videoCanvas');
      engine = new WeddingVideoEngine(canvas, {
        duration: 45,
        watermark: true
      });
      engine.play();

      canvas.addEventListener('click', () => {
        togglePlay();
      });
    });

    function togglePlay() {
      if (!engine) return;
      engine.togglePlay();
      document.getElementById('btnToggle').textContent = engine.isPlaying ? '❚❚ Pause' : '▶ Play';
    }
  </script>
</body>
</html>
