<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temple Grandeur — Vedic Heritage Builder Studio | Vanvi Moments</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-studio: #0e0508;
      --bg-panel: #17090e;
      --bg-card: #220b12;
      --terracotta: #451006;
      --accent-gold: #eab308;
      --gold-light: #fef08a;
      --text-white: #ffffff;
      --text-muted: #a38c94;
      --border-gold: rgba(234, 179, 8, 0.3);
      --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-display: 'Cinzel', serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-studio);
      color: var(--text-white);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Top Studio Header */
    .studio-header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-gold);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .studio-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }
    .logo-badge {
      font-size: 22px;
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid var(--accent-gold);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }
    .logo-title {
      font-family: var(--font-display);
      font-size: 15px;
      letter-spacing: 1.5px;
      color: var(--gold-light);
      font-weight: 700;
    }
    .logo-sub {
      font-size: 11px;
      color: var(--text-muted);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .device-switcher {
      display: flex;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 99px;
      padding: 3px;
    }
    .dev-btn {
      background: transparent;
      border: 0;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .dev-btn.active {
      background: var(--accent-gold);
      color: #000;
    }
    .btn-checkout {
      background: linear-gradient(135deg, #eab308, #ca8a04);
      color: #000;
      font-weight: 800;
      font-size: 12px;
      padding: 10px 22px;
      border-radius: 99px;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(234, 179, 8, 0.35);
      transition: transform 0.2s;
    }
    .btn-checkout:hover {
      transform: translateY(-2px);
    }

    /* Main Studio Split Layout */
    .studio-main {
      flex: 1;
      display: flex;
      height: calc(100vh - 65px);
      overflow: hidden;
    }
    .editor-pane {
      width: 440px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-gold);
      overflow-y: auto;
      padding: 24px 20px;
    }
    .preview-pane {
      flex: 1;
      background: #090204;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }
    .preview-frame-wrapper {
      width: 100%;
      height: 100%;
      max-width: 440px;
      max-height: 840px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(234, 179, 8, 0.3);
      transition: max-width 0.3s ease;
      background: #451006;
    }
    .preview-frame-wrapper.desktop-mode {
      max-width: 900px;
    }
    .preview-frame {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Form Card Styles */
    .sec-card {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .sec-card-title {
      font-family: var(--font-display);
      font-size: 14px;
      color: var(--accent-gold);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      border-color: var(--accent-gold);
    }
    .watermark-demo-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(234, 179, 8, 0.12);
      border: 1px solid rgba(234, 179, 8, 0.3);
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 11px;
      color: var(--gold-light);
      margin-top: 10px;
    }

    @media (max-width: 900px) {
      .studio-main { flex-direction: column-reverse; height: auto; }
      .editor-pane { width: 100%; height: auto; }
      .preview-pane { height: 600px; padding: 12px; }
    }
  </style>
</head>
<body>
  <!-- Top Navigation -->
  <header class="studio-header">
    <a href="../../templates.html" class="studio-logo">
      <div class="logo-badge">🕉️</div>
      <div>
        <div class="logo-title">VANVI MOMENTS</div>
        <div class="logo-sub">Temple Grandeur Vedic Studio</div>
      </div>
    </a>

    <div class="header-actions">
      <div class="device-switcher">
        <button class="dev-btn active" id="btnDevMobile" onclick="setDevice('mobile')">📱 Mobile</button>
        <button class="dev-btn" id="btnDevDesktop" onclick="setDevice('desktop')">💻 Desktop</button>
      </div>
      <a id="btnProceedCheckout" href="../../checkout.html?templateId=temple-grandeur&price=999" class="btn-checkout">Publish &amp; Activate (₹999)</a>
    </div>
  </header>

  <!-- Studio Split Main -->
  <main class="studio-main">
    <!-- Left Configuration Pane -->
    <aside class="editor-pane">
      <div class="sec-card">
        <div class="sec-card-title"><span>💑</span> Sacred Couple Names</div>
        <div class="form-group">
          <label class="form-label">Bride's Name</label>
          <input type="text" id="inBride" class="form-input" value="Tanya" oninput="updatePreview()">
        </div>
        <div class="form-group">
          <label class="form-label">Groom's Name</label>
          <input type="text" id="inGroom" class="form-input" value="Rohan" oninput="updatePreview()">
        </div>
      </div>

      <div class="sec-card">
        <div class="sec-card-title"><span>🛕</span> Muhurat &amp; Sacred Mandapam</div>
        <div class="form-group">
          <label class="form-label">Auspicious Wedding Date</label>
          <input type="text" id="inDate" class="form-input" value="12th December 2026" oninput="updatePreview()">
        </div>
        <div class="form-group">
          <label class="form-label">Palace / Mandapam Venue</label>
          <input type="text" id="inVenue" class="form-input" value="The Grand Palace Grounds, Udaipur" oninput="updatePreview()">
        </div>
      </div>

      <div class="sec-card">
        <div class="sec-card-title"><span>💬</span> Guest RSVP &amp; WhatsApp</div>
        <div class="form-group">
          <label class="form-label">WhatsApp RSVP Number (with country code)</label>
          <input type="tel" id="inWa" class="form-input" value="917631442934" oninput="updatePreview()">
        </div>
        <div class="watermark-demo-pill">
          <span>✨</span> Official Vanvi Moments Vedic Keepsake Edition
        </div>
      </div>
    </aside>

    <!-- Right Live Preview Pane -->
    <section class="preview-pane">
      <div class="preview-frame-wrapper" id="frameWrapper">
        <iframe id="previewFrame" class="preview-frame" src="index.html"></iframe>
      </div>
    </section>
  </main>

  <script>
    function updatePreview() {
      const bride = encodeURIComponent(document.getElementById('inBride').value.trim() || 'Tanya');
      const groom = encodeURIComponent(document.getElementById('inGroom').value.trim() || 'Rohan');
      const date = encodeURIComponent(document.getElementById('inDate').value.trim() || '12th December 2026');
      const venue = encodeURIComponent(document.getElementById('inVenue').value.trim() || 'The Grand Palace Grounds, Udaipur');
      const wa = encodeURIComponent(document.getElementById('inWa').value.trim() || '917631442934');

      const url = `index.html?bride=${bride}&groom=${groom}&date=${date}&venue=${venue}&whatsapp=${wa}`;
      document.getElementById('previewFrame').src = url;

      // Update checkout button link with customized couple name
      const cleanBride = decodeURIComponent(bride);
      const cleanGroom = decodeURIComponent(groom);
      document.getElementById('btnProceedCheckout').href = `../../checkout.html?templateId=temple-grandeur&price=999&recipientName=${encodeURIComponent(cleanBride + ' & ' + cleanGroom)}`;
    }

    function setDevice(mode) {
      const wrap = document.getElementById('frameWrapper');
      const btnM = document.getElementById('btnDevMobile');
      const btnD = document.getElementById('btnDevDesktop');

      if (mode === 'desktop') {
        wrap.classList.add('desktop-mode');
        btnD.classList.add('active');
        btnM.classList.remove('active');
      } else {
        wrap.classList.remove('desktop-mode');
        btnM.classList.add('active');
        btnD.classList.remove('active');
      }
    }
  </script>
</body>
</html>
