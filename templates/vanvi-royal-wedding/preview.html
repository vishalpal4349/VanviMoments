<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview: Royal Vows — The Wedding Experience | Vanvi Moments</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090204;
      color: #fff;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .preview-header {
      background: #140509;
      border-bottom: 1px solid rgba(196, 152, 90, 0.3);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-link {
      color: #c4985a;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .preview-title {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      color: #dfba82;
      letter-spacing: 0.5px;
    }
    .device-switcher {
      display: flex;
      gap: 6px;
      background: #1f0a11;
      padding: 4px;
      border-radius: 99px;
      border: 1px solid rgba(196, 152, 90, 0.25);
    }
    .btn-dev {
      background: transparent;
      border: 0;
      color: #a38c94;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-dev.active {
      background: #c4985a;
      color: #000;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-builder {
      background: rgba(196, 152, 90, 0.15);
      border: 1px solid #c4985a;
      color: #dfba82;
      padding: 8px 16px;
      border-radius: 99px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
    }
    .btn-checkout {
      background: linear-gradient(135deg, #c4985a, #926c36);
      color: #000;
      border: 0;
      padding: 8px 20px;
      border-radius: 99px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(196, 152, 90, 0.3);
    }

    .preview-frame-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at center, #1b060d 0%, #090204 80%);
    }
    .frame-wrapper {
      width: 414px;
      height: 840px;
      max-height: 88vh;
      border-radius: 36px;
      border: 4px solid #2e141d;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.9), 0 0 40px rgba(196, 152, 90, 0.2);
      overflow: hidden;
      background: #000;
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .frame-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <header class="preview-header">
    <div class="header-left">
      <a href="../../templates.html" class="back-link">← All Templates</a>
      <span class="preview-title">Royal Vows — The Wedding Experience (₹2,499)</span>
    </div>

    <div class="device-switcher">
      <button type="button" class="btn-dev active" onclick="switchDevice(414, this)">Mobile (414px)</button>
      <button type="button" class="btn-dev" onclick="switchDevice(375, this)">Compact (375px)</button>
      <button type="button" class="btn-dev" onclick="switchDevice(768, this)">Tablet (768px)</button>
      <button type="button" class="btn-dev" onclick="switchDevice(1180, this)">Desktop (1180px)</button>
    </div>

    <div class="header-actions">
      <a href="builder.html" class="btn-builder">Open Guided Studio ✦</a>
      <a href="../../checkout.html?templateId=vanvi-royal-wedding&price=2499&name=Royal%20Vows%20Wedding%20Experience" class="btn-checkout">Use This Template (₹2,499) →</a>
    </div>
  </header>

  <main class="preview-frame-container">
    <div class="frame-wrapper" id="frameWrap">
      <iframe src="index.html" title="Royal Vows Experience Preview"></iframe>
    </div>
  </main>

  <script>
    function switchDevice(w, btn) {
      document.getElementById('frameWrap').style.width = w + 'px';
      document.querySelectorAll('.btn-dev').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
