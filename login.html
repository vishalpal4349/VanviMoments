<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem('vanvi_aesthetic_theme')||'clay';var f=localStorage.getItem('vanvi_font_pref')||'royal';document.documentElement.setAttribute('data-vanvi-theme',t);document.documentElement.setAttribute('data-vanvi-font',f);}catch(e){}})();</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5.0, user-scalable=yes" />
  <title>Login | Vanvi Moments</title>
  <meta name="description" content="Sign in to your Vanvi Moments account to craft and manage handcrafted digital celebration invitations." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vanvi-inner-light.css" />
  <link rel="stylesheet" href="vanvi-navigation.css" />
  <link rel="stylesheet" href="css/vanvi-global-experience.css" />

  <!-- Google Identity Services Official Client -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      /* Ultra-Vibrant Twilight Amethyst, Royal Indigo & Radiant Magenta */
      --clay-bg-grad: radial-gradient(circle at 10% 15%, rgba(139, 92, 246, 0.45) 0%, transparent 45%),
                      radial-gradient(circle at 90% 12%, rgba(236, 72, 153, 0.4) 0%, transparent 45%),
                      radial-gradient(circle at 50% 90%, rgba(245, 158, 11, 0.35) 0%, transparent 45%),
                      radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.4) 0%, transparent 50%),
                      linear-gradient(135deg, #ede9fe 0%, #fae8ff 35%, #ffe4e6 70%, #fef3c7 100%);
      --clay-primary: #8b5cf6;
      --clay-primary-dark: #7c3aed;
      --clay-primary-grad: linear-gradient(135deg, #8b5cf6 0%, #a855f7 40%, #ec4899 100%);
      --clay-input-bg: #f8f4ff;
      --clay-text-dark: #280b45;
      --clay-text-muted: #6f4c94;
      --clay-shadow-card: 0 25px 65px -12px rgba(124, 58, 237, 0.28), 0 8px 24px -4px rgba(236, 72, 153, 0.16), 0 0 0 1.5px rgba(255, 255, 255, 0.95), inset 0 2px 2px #ffffff;
      --clay-shadow-inner: 0 8px 24px rgba(124, 58, 237, 0.08), inset 0 2px 2px #ffffff;
      --clay-shadow-btn: 0 10px 24px -4px rgba(139, 92, 246, 0.45), 0 3px 0 #6d28d9, inset 0 2px 2px rgba(255, 255, 255, 0.8), inset 0 -2px 3px rgba(0, 0, 0, 0.16);
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--clay-bg-grad);
      background-attachment: fixed;
      font-family: var(--font-sans);
      color: var(--clay-text-dark);
      overflow-x: hidden !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 12px;
      position: relative;
    }

    /* Ambient Luxury Glowing Background Props */
    .clay-studio-props {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .luxe-glow-orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      will-change: transform;
    }
    .luxe-glow-orb-1 {
      top: -60px;
      left: -60px;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.42) 0%, rgba(236, 72, 153, 0.18) 60%, transparent 80%);
      filter: blur(60px);
      animation: driftGlow1 16s ease-in-out infinite alternate;
    }
    .luxe-glow-orb-2 {
      bottom: -60px;
      right: -60px;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(244, 63, 94, 0.38) 0%, rgba(245, 158, 11, 0.25) 60%, transparent 80%);
      filter: blur(65px);
      animation: driftGlow2 20s ease-in-out infinite alternate;
    }
    .clay-prop-star {
      position: absolute;
      font-weight: 900;
      user-select: none;
      animation: sparkle 3.5s ease-in-out infinite alternate;
    }
    .star-1 { top: 12%; left: 14%; font-size: 24px; color: #a855f7; text-shadow: 0 0 16px rgba(168, 85, 247, 0.6); }
    .star-2 { top: 16%; right: 15%; font-size: 22px; color: #ec4899; text-shadow: 0 0 16px rgba(236, 72, 153, 0.6); animation-delay: -1.2s; }
    .star-3 { bottom: 18%; left: 16%; font-size: 26px; color: #f59e0b; text-shadow: 0 0 16px rgba(245, 158, 11, 0.6); animation-delay: -2s; }
    .star-4 { bottom: 15%; right: 18%; font-size: 20px; color: #8b5cf6; text-shadow: 0 0 16px rgba(139, 92, 246, 0.6); animation-delay: -0.7s; }

    @keyframes driftGlow1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 40px) scale(1.12); }
    }
    @keyframes driftGlow2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-35px, -30px) scale(1.1); }
    }
    @keyframes sparkle {
      0% { opacity: 0.45; transform: scale(0.9) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.15) rotate(15deg); }
      100% { opacity: 0.45; transform: scale(0.9) rotate(0deg); }
    }

    /* Fixed Back Button */
    .clay-nav-back {
      position: fixed;
      top: 16px;
      left: 18px;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      min-height: 38px;
      border-radius: 999px;
      background: #ffffff;
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.14), inset 0 2px 2px #ffffff;
      color: #280b45;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 850;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .clay-nav-back:hover {
      transform: translateX(-3px) scale(1.03);
      color: var(--clay-primary);
      box-shadow: 0 12px 28px rgba(124, 58, 237, 0.25);
    }
    .clay-nav-back .back-arrow {
      font-size: 16px;
      line-height: 1;
      font-weight: 900;
    }

    /* Top Mode Switcher Bar */
    .clay-mode-switch-wrap {
      width: 100%;
      max-width: 395px;
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
      position: relative;
      z-index: 10;
    }
    .clay-mode-switch {
      display: inline-flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 4px;
      border-radius: 999px;
      box-shadow: 0 6px 18px rgba(124, 58, 237, 0.1), inset 0 1px 2px #fff;
      border: 1px solid rgba(255, 255, 255, 0.95);
      gap: 4px;
    }
    .clay-mode-tab {
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      color: var(--clay-text-muted);
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .clay-mode-tab.active {
      background: var(--clay-primary);
      background-image: var(--clay-primary-grad);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.35);
    }
    .clay-coins-tag {
      font-size: 9px;
      padding: 1.5px 6px;
      border-radius: 99px;
      background: #f59e0b;
      color: #fff;
      font-weight: 900;
      box-shadow: 0 2px 6px rgba(245, 158, 11, 0.3);
    }

    /* Master Floating Center Card (~395px compact on laptop & mobile) */
    .clay-phone-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 395px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-radius: 32px;
      box-shadow: var(--clay-shadow-card);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      padding: 16px 14px 14px;
      margin: 0 auto;
      text-align: center;
      overflow: hidden;
      animation: cardPopEnter 0.38s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardPopEnter {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Top Greeting Section with Compact Luxury Avatar */
    .clay-header-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 6px;
    }
    .clay-avatar-bubble {
      position: relative;
      width: 56px;
      height: 56px;
      margin: 0 auto 5px;
      border-radius: 50%;
      padding: 2.5px;
      background: var(--clay-primary-grad);
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.28), 0 0 0 2px rgba(255, 255, 255, 0.95);
      animation: avatarFloat 4s ease-in-out infinite alternate;
    }
    @keyframes avatarFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-3px); }
    }
    .clay-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #ffffff;
    }
    .clay-avatar-sparkle {
      position: absolute;
      bottom: -2px;
      right: -2px;
      font-size: 13px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }
    .clay-main-title {
      font-size: 21px;
      font-weight: 900;
      color: var(--clay-text-dark);
      letter-spacing: -0.3px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin: 0;
    }
    .clay-sub-text {
      font-size: 11.5px;
      color: var(--clay-text-muted);
      margin-top: 2px;
      font-weight: 600;
    }

    /* Inner Elevated White Clay Form Card */
    .clay-inner-card {
      position: relative;
      z-index: 4;
      background: #ffffff;
      border-radius: 26px;
      padding: 14px 14px 12px;
      box-shadow: var(--clay-shadow-inner);
      border: 1.5px solid rgba(243, 232, 255, 0.95);
    }

    /* Inset Input Rows */
    .clay-field-row {
      margin-bottom: 9px;
      position: relative;
      text-align: left;
    }
    .clay-pill-input-box {
      width: 100%;
      min-height: 44px;
      background: var(--clay-input-bg);
      border-radius: 999px;
      box-shadow: inset 0 2px 4px rgba(124, 58, 237, 0.08), inset 0 1px 2px rgba(0,0,0,0.03);
      display: flex;
      align-items: center;
      padding: 3px 6px 3px 5px;
      transition: all 0.2s ease;
      border: 1.5px solid transparent;
    }
    .clay-pill-input-box:focus-within {
      background: #ffffff;
      border-color: var(--clay-primary);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.22), inset 0 1px 2px #fff;
    }
    .clay-icon-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
      color: #ffffff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: 0 3px 8px rgba(124, 58, 237, 0.3), inset 0 1px 2px rgba(255,255,255,0.7);
    }
    .clay-icon-circle svg {
      width: 15px;
      height: 15px;
    }
    .clay-native-input {
      flex: 1;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      padding: 0 10px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      color: var(--clay-text-dark);
      min-width: 0;
    }
    .clay-native-input::placeholder {
      color: #9f86bb;
      font-weight: 500;
      font-size: 12.5px;
    }
    .clay-pwd-toggle {
      background: transparent;
      border: none;
      font-size: 15px;
      color: #8c71aa;
      cursor: pointer;
      padding: 4px 8px;
      transition: transform 0.2s ease, color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .clay-pwd-toggle:hover {
      transform: scale(1.15);
      color: var(--clay-primary);
    }

    /* Auxiliary Links Row */
    .clay-aux-links {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 8px 4px 12px;
      font-size: 11.5px;
    }
    .clay-remember-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--clay-text-muted);
      cursor: pointer;
      font-weight: 600;
      user-select: none;
    }
    .clay-remember-wrap input {
      accent-color: var(--clay-primary);
      width: 14px;
      height: 14px;
      cursor: pointer;
    }
    .clay-forgot-link {
      color: var(--clay-primary);
      font-weight: 800;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .clay-forgot-link:hover {
      text-decoration: underline;
      color: var(--clay-primary-dark);
    }

    /* Primary Action Button */
    .clay-btn-main {
      width: 100%;
      min-height: 44px;
      border-radius: 999px;
      background: var(--clay-primary-grad);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.65);
      font-family: var(--font-sans);
      font-size: 14.5px;
      font-weight: 850;
      letter-spacing: 0.2px;
      cursor: pointer;
      box-shadow: var(--clay-shadow-btn);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .clay-btn-main:hover {
      transform: translateY(-2px) scale(1.015);
      box-shadow: 0 12px 26px rgba(139, 92, 246, 0.5), 0 4px 0 #6d28d9;
    }
    .clay-btn-main:active {
      transform: translateY(2px) scale(0.985);
      box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3), 0 1px 0 #6d28d9;
    }
    .clay-btn-main:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Loading Spinner */
    .btn-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: inline-block;
      flex-shrink: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Status Alert Message */
    .form-status {
      margin-top: 8px;
      font-size: 11.5px;
      font-weight: 700;
      min-height: 16px;
      color: var(--clay-text-muted);
      padding: 5px 8px;
      border-radius: 8px;
      transition: all 0.2s ease;
      text-align: center;
    }
    .form-status.error {
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #fee2e2;
    }
    .form-status.success {
      color: #15803d;
      background: #f0fdf4;
      border: 1px solid #dcfce7;
    }

    /* Divider */
    .clay-divider-line {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 10px 0;
      color: #9f86bb;
      font-size: 10px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .clay-divider-line::before,
    .clay-divider-line::after {
      content: '';
      flex: 1;
      border-bottom: 1.5px solid #eae2f5;
    }
    .clay-divider-line span {
      padding: 0 8px;
    }

    /* Official Google Mount Container (Single Clean Trigger) */
    .gsi-mount-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 6px 0 10px;
      min-height: 42px;
      width: 100%;
    }
    .btn-google-trigger {
      width: 100%;
      min-height: 42px;
      border-radius: 999px;
      background: #ffffff;
      border: 1.5px solid #e2d9f3;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.08), inset 0 1px 1px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 750;
      color: #374151;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-google-trigger:hover {
      transform: translateY(-1.5px);
      border-color: #4285F4;
      box-shadow: 0 8px 18px rgba(66, 133, 244, 0.16);
      color: #1f2937;
    }
    .google-g-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* Footer Switch Link */
    .clay-footer-link {
      font-size: 12px;
      color: var(--clay-text-muted);
      font-weight: 600;
    }
    .clay-footer-link a {
      color: var(--clay-primary);
      font-weight: 850;
      text-decoration: none;
      margin-left: 4px;
    }
    .clay-footer-link a:hover {
      text-decoration: underline;
    }

    /* Confetti Particle */
    .success-confetti-particle {
      position: fixed;
      pointer-events: none;
      z-index: 100000;
      font-size: 20px;
      animation: confettiBurst 0.9s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }
    @keyframes confettiBurst {
      0% { opacity: 1; transform: translate(0, 0) scale(0.5); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.4) rotate(var(--dr)); }
    }

    /* Responsive Adaptations */
    @media (max-width: 860px) {
      .prop-potted-plant,
      .prop-potted-flower {
        display: none !important;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 50px 10px 20px;
        justify-content: flex-start;
      }
      .clay-nav-back {
        top: 10px;
        left: 10px;
        padding: 5px 12px;
        min-height: 34px;
        font-size: 11.5px;
      }
      .clay-phone-card {
        padding: 16px 12px 14px;
        border-radius: 28px;
      }
      .clay-main-title {
        font-size: 21px;
      }
      .clay-girl-stage {
        max-width: 115px;
        margin-bottom: -16px;
      }
      .clay-inner-card {
        padding: 16px 12px 12px;
        border-radius: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body class="vanvi-auth-body" id="authBody">

  <!-- Ambient 3D Luxury Cosmic Aurora Glowing Props -->
  <div class="clay-studio-props" aria-hidden="true">
    <div class="luxe-glow-orb luxe-glow-orb-1"></div>
    <div class="luxe-glow-orb luxe-glow-orb-2"></div>
    <div class="clay-prop-star star-1">✦</div>
    <div class="clay-prop-star star-2">✨</div>
    <div class="clay-prop-star star-3">⭐</div>
    <div class="clay-prop-star star-4">✦</div>
  </div>

  <!-- Smart Fixed Back Button -->
  <a class="clay-nav-back" href="javascript:void(0)" onclick="vanviGoBack('index.html')" aria-label="Back to home">
    <span class="back-arrow" aria-hidden="true">‹</span>
    <span>Back</span>
  </a>

  <!-- Mode Switcher -->
  <div class="clay-mode-switch-wrap">
    <nav class="clay-mode-switch" aria-label="Auth tabs">
      <a href="login.html" class="clay-mode-tab active" aria-current="page">
        <span>🔑</span>
        <span>Sign In</span>
      </a>
      <a href="signup.html" class="clay-mode-tab">
        <span>✨</span>
        <span>Sign Up</span>
      </a>
    </nav>
  </div>

  <!-- Master Floating Center Card (~395px wide centered on desktop & mobile) -->
  <main class="clay-phone-card" id="authStage" role="main">

    <!-- Top Greeting Section with Compact Luxury Avatar -->
    <header class="clay-header-top">
      <div class="clay-avatar-bubble" aria-hidden="true">
        <img src="assets/vanvi-clay-girl-login.jpg" alt="Vanvi Moments" class="clay-avatar-img" />
        <span class="clay-avatar-sparkle">✨</span>
      </div>
      <h1 class="clay-main-title" id="loginTitle">
        <span>Welcome Back</span>
      </h1>
      <p class="clay-sub-text">Sign in to continue celebrating</p>
    </header>

    <!-- Elevated Inner White Clay Form Card -->
    <section class="clay-inner-card" aria-label="Sign in credentials">
      <form id="loginForm" novalidate>

        <!-- Email or Mobile Field -->
        <div class="clay-field-row">
          <div class="clay-pill-input-box">
            <div class="clay-icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
            </div>
            <input class="clay-native-input" id="loginEmail" name="email" type="text" placeholder="Email or Mobile Number" autocomplete="username" required aria-label="Email or Mobile Number" />
          </div>
        </div>

        <!-- Password Field -->
        <div class="clay-field-row">
          <div class="clay-pill-input-box">
            <div class="clay-icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
              </svg>
            </div>
            <input class="clay-native-input" id="loginPassword" name="password" type="password" placeholder="Password" autocomplete="current-password" required aria-label="Password" />
            <button type="button" class="clay-pwd-toggle" id="btnTogglePwd" title="Show/Hide Password" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <!-- Auxiliary Links: Remember me & Forgot Password -->
        <div class="clay-aux-links">
          <label class="clay-remember-wrap">
            <input type="checkbox" id="rememberMe" checked />
            <span>Remember me</span>
          </label>
          <a class="clay-forgot-link" href="forgot-password.html">Forgot Password?</a>
        </div>

        <!-- Tactile 3D Clay Login Button -->
        <button class="clay-btn-main" type="submit" id="btnLoginSubmit">
          <span class="btn-spinner" id="loginSpinner" style="display:none;" aria-hidden="true"></span>
          <span id="loginBtnText">Sign In ✨</span>
        </button>

        <!-- Status Alert Message -->
        <p id="loginStatus" class="form-status" role="status" aria-live="polite" style="display:none;"></p>
      </form>

      <!-- Single Official Google Sign-In Section -->
      <div class="clay-divider-line">
        <span>or continue with</span>
      </div>

      <div class="gsi-mount-wrap" id="gsiMountWrap">
        <div id="gsiButtonContainer"></div>
        <button type="button" class="btn-google-trigger" id="googleUnifiedBtn" title="Continue with Google" aria-label="Sign in with Google">
          <svg class="google-g-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span>Continue with Google</span>
        </button>
      </div>

      <!-- Bottom Switch Link -->
      <p class="clay-footer-link">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </p>
    </section>
  </main>

  <!-- Central Client API, Google Auth & Navigation Scripts -->
  <script src="js/vanvi-api.js"></script>
  <script src="js/vanvi-google-auth.js"></script>
  <script src="js/vanvi-i18n.js"></script>

  <script>
    // Universal safe back navigation helper
    function vanviGoBack(fallbackUrl) {
      if (window.history.length > 1 && document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
        window.history.back();
      } else {
        window.location.href = fallbackUrl || 'index.html';
      }
    }

    (function () {
      'use strict';

      const form = document.getElementById('loginForm');
      const status = document.getElementById('loginStatus');
      const googleBtn = document.getElementById('googleUnifiedBtn');
      const authStage = document.getElementById('authStage');
      const btnTogglePwd = document.getElementById('btnTogglePwd');
      const pwdInput = document.getElementById('loginPassword');
      const emailInput = document.getElementById('loginEmail');
      const rememberCheckbox = document.getElementById('rememberMe');
      const btnSubmit = document.getElementById('btnLoginSubmit');
      const spinner = document.getElementById('loginSpinner');
      const btnText = document.getElementById('loginBtnText');

      // Auto-fill remembered identifier
      try {
        const remembered = localStorage.getItem('vanvi_remember_identifier') || localStorage.getItem('vanvi_last_email');
        if (remembered) {
          emailInput.value = remembered;
          if (rememberCheckbox) rememberCheckbox.checked = true;
        }
      } catch (e) {}

      // Handle redirect status message (e.g. from password reset)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('reset') === 'success') {
        showStatus('✓ Password updated successfully! Please sign in with your new password.', 'success');
      }

      function showStatus(msg, type) {
        if (!status) return;
        if (!msg) {
          status.style.display = 'none';
          status.textContent = '';
          return;
        }
        status.style.display = 'block';
        status.textContent = msg;
        status.className = 'form-status ' + (type || '');
      }

      function setLoading(isLoading) {
        if (btnSubmit) btnSubmit.disabled = isLoading;
        if (spinner) spinner.style.display = isLoading ? 'inline-block' : 'none';
        if (btnText) btnText.textContent = isLoading ? 'Signing in...' : 'Sign In';
      }

      // Password Visibility Toggle
      btnTogglePwd?.addEventListener('click', () => {
        if (pwdInput.type === 'password') {
          pwdInput.type = 'text';
          btnTogglePwd.textContent = '🔒';
          btnTogglePwd.setAttribute('aria-label', 'Hide password');
        } else {
          pwdInput.type = 'password';
          btnTogglePwd.textContent = '👁️';
          btnTogglePwd.setAttribute('aria-label', 'Show password');
        }
      });

      // Celebration Confetti Sequence
      window.triggerAuthSuccessCelebration = function (redirectUrl) {
        const emojis = ['✨', '🪙', '✦', '⭐', '💫', '🌟'];
        const cardRect = (authStage || document.body).getBoundingClientRect();
        const centerX = cardRect.left + cardRect.width / 2;
        const centerY = cardRect.top + cardRect.height / 2;

        for (let i = 0; i < 28; i++) {
          const p = document.createElement('div');
          p.className = 'success-confetti-particle';
          p.textContent = emojis[i % emojis.length];
          const angle = (i / 28) * 2 * Math.PI;
          const dist = 90 + Math.random() * 180;
          const dx = Math.cos(angle) * dist + 'px';
          const dy = Math.sin(angle) * dist + 'px';
          const dr = (Math.random() * 720 - 360) + 'deg';
          p.style.setProperty('--dx', dx);
          p.style.setProperty('--dy', dy);
          p.style.setProperty('--dr', dr);
          p.style.left = centerX + 'px';
          p.style.top = centerY + 'px';
          document.body.appendChild(p);
          setTimeout(() => p.remove(), 1000);
        }

        setTimeout(() => {
          window.location.href = redirectUrl || 'dashboard.html';
        }, 800);
      };

      // Standard Login Form Submission
      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        showStatus('');

        const identifier = emailInput.value.trim();
        const password = pwdInput.value;

        if (!identifier) {
          showStatus('Please enter your registered email or mobile number.', 'error');
          emailInput.focus();
          return;
        }

        if (!password) {
          showStatus('Please enter your password.', 'error');
          pwdInput.focus();
          return;
        }

        setLoading(true);

        try {
          const result = await window.VanviAPI.auth.login({ identifier, password });
          if (result.success) {
            if (rememberCheckbox && rememberCheckbox.checked) {
              localStorage.setItem('vanvi_remember_identifier', identifier);
              localStorage.setItem('vanvi_remember_me', 'true');
            } else {
              localStorage.removeItem('vanvi_remember_identifier');
              localStorage.removeItem('vanvi_remember_me');
            }

            showStatus('Welcome back! Opening your celebration dashboard... ✨', 'success');
            const redirectUrl = new URLSearchParams(location.search).get('redirect') || 'dashboard.html';
            window.triggerAuthSuccessCelebration(redirectUrl);
            return;
          }

          setLoading(false);
          showStatus(result.error || 'Invalid email/mobile or password. Please try again.', 'error');
        } catch (err) {
          setLoading(false);
          showStatus('Network connection error. Please try again.', 'error');
        }
      });

      // Google Unified Sign-In Action
      googleBtn?.addEventListener('click', function () {
        if (window.VanviGoogleAuth) {
          window.VanviGoogleAuth.signIn({
            onSuccess: (res) => {
              showStatus(`Signed in as ${res.user.name}! Opening dashboard... ✨`, 'success');
              const redirectUrl = new URLSearchParams(location.search).get('redirect') || 'dashboard.html';
              window.triggerAuthSuccessCelebration(redirectUrl);
            },
            onError: (err) => {
              showStatus(err.message || 'Google sign-in could not be completed.', 'error');
            }
          });
        }
      });

      // Attempt GIS button rendering into #gsiButtonContainer if supported
      window.addEventListener('load', () => {
        if (window.VanviGoogleAuth && window.VanviGoogleAuth.renderButton) {
          window.VanviGoogleAuth.renderButton('gsiButtonContainer', {
            theme: 'outline',
            size: 'large',
            shape: 'pill',
            text: 'continue_with',
            width: 320
          });
        }
      });

    })();
  </script>
  <!-- GLOBAL VANVI NAVIGATION DOCK -->
  <script src="js/vanvi-navigation.js"></script>
</body>
</html>
