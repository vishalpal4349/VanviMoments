<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem('vanvi_aesthetic_theme')||'clay';var f=localStorage.getItem('vanvi_font_pref')||'royal';document.documentElement.setAttribute('data-vanvi-theme',t);document.documentElement.setAttribute('data-vanvi-font',f);}catch(e){}})();</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5.0, user-scalable=yes" />
  <title>Login | Vanvi Moments</title>
  <meta name="description" content="Sign in to your Vanvi Moments account to craft and manage handcrafted digital celebration invitations." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vanvi-inner-light.css" />
  <link rel="stylesheet" href="vanvi-navigation.css" />
  <link rel="stylesheet" href="css/vanvi-global-experience.css" />

  <!-- Google Identity Services Official Client -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --clay-bg-grad: radial-gradient(circle at 50% 28%, #f0e6ff 0%, #dfd0fc 48%, #c6b2f4 100%);
      --clay-primary: #9471e4;
      --clay-primary-grad: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
      --clay-input-bg: #f5f0fb;
      --clay-text-dark: #2c1642;
      --clay-text-muted: #7b6694;
      --clay-shadow-card: 0 16px 40px rgba(110, 80, 168, 0.2), 0 4px 12px rgba(0, 0, 0, 0.04), inset 0 2px 3px #ffffff;
      --clay-shadow-inner: 0 8px 24px rgba(120, 90, 180, 0.08), inset 0 2px 2px #ffffff;
      --clay-shadow-btn: 0 8px 20px rgba(148, 113, 228, 0.38), 0 2px 0 #6e46be;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--clay-bg-grad);
      font-family: var(--font-sans);
      color: var(--clay-text-dark);
      overflow-x: hidden !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 12px;
      position: relative;
    }

    /* Ambient Floating Props (Soft & Compact) */
    .clay-studio-props {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .clay-prop {
      position: absolute;
      user-select: none;
      filter: drop-shadow(0 10px 20px rgba(90, 60, 140, 0.14));
      opacity: 0.75;
    }
    .prop-cloud-1 { top: 4%; left: 5%; font-size: 36px; }
    .prop-cloud-2 { top: 8%; right: 5%; font-size: 38px; }
    .prop-heart-float { top: 22%; left: 7%; font-size: 22px; }
    .prop-star-float { top: 20%; right: 7%; font-size: 20px; }

    /* Smart Fixed Back Button */
    .clay-nav-back {
      position: fixed;
      top: 12px;
      left: 14px;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      min-height: 32px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.12);
      color: #280b45;
      font-size: 11.5px;
      font-weight: 850;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .clay-nav-back:hover {
      transform: translateX(-2px);
      color: var(--clay-primary);
    }

    /* Mode Switcher Bar */
    .clay-mode-switch-wrap {
      width: 100%;
      max-width: 375px;
      display: flex;
      justify-content: center;
      margin-bottom: 6px;
      position: relative;
      z-index: 10;
    }
    .clay-mode-switch {
      display: inline-flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.95);
      padding: 3px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.95);
      gap: 3px;
    }
    .clay-mode-tab {
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--clay-text-muted);
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .clay-mode-tab.active {
      background: var(--clay-primary);
      background-image: var(--clay-primary-grad);
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(139, 92, 246, 0.35);
    }
    .clay-coins-tag {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 99px;
      background: #f59e0b;
      color: #fff;
      font-weight: 900;
    }

    /* Master Compact Phone Card (~375px STRICT on Laptop & Mobile) */
    .clay-phone-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 375px;
      background: #ffffff;
      border-radius: 30px;
      box-shadow: var(--clay-shadow-card);
      padding: 14px 14px 12px;
      margin: 0 auto;
      text-align: center;
      box-sizing: border-box;
      animation: authCardEnter 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes authCardEnter {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Top Greeting Section */
    .clay-header-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2px;
    }
    .clay-heart-emblem {
      font-size: 16px;
      margin-bottom: 1px;
    }
    .clay-main-title {
      font-size: 19px;
      font-weight: 900;
      color: var(--clay-text-dark);
      letter-spacing: -0.3px;
      margin: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .clay-sub-text {
      font-size: 11px;
      color: var(--clay-text-muted);
      margin-top: 1px;
      font-weight: 600;
    }

    /* 3D Cute Clay Character */
    .clay-girl-stage {
      position: relative;
      width: 100%;
      max-width: 95px;
      margin: 0 auto -12px;
      z-index: 2;
    }
    .clay-girl-photo {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      border-radius: 24px 24px 0 0;
      filter: drop-shadow(0 8px 16px rgba(110, 80, 168, 0.18));
    }

    /* Elevated Inner White Clay Form Card */
    .clay-inner-card {
      position: relative;
      z-index: 4;
      background: #ffffff;
      border-radius: 22px;
      padding: 12px 12px 10px;
      box-shadow: var(--clay-shadow-inner);
      border: 1px solid rgba(243, 232, 255, 0.95);
    }

    /* Inset Input Rows */
    .clay-field-row {
      margin-bottom: 8px;
      position: relative;
      text-align: left;
    }
    .clay-pill-input-box {
      width: 100%;
      height: 38px;
      background: var(--clay-input-bg);
      border-radius: 999px;
      box-shadow: inset 0 2px 4px rgba(124, 58, 237, 0.08);
      display: flex;
      align-items: center;
      padding: 2px 6px 2px 4px;
      border: 1.5px solid transparent;
      transition: all 0.2s ease;
    }
    .clay-pill-input-box:focus-within {
      background: #ffffff;
      border-color: var(--clay-primary);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.22);
    }
    .clay-icon-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
      color: #ffffff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .clay-icon-circle svg {
      width: 14px;
      height: 14px;
    }
    .clay-native-input {
      flex: 1;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      padding: 0 8px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      color: var(--clay-text-dark);
      min-width: 0;
    }
    .clay-native-input::placeholder {
      color: #9f86bb;
      font-weight: 500;
      font-size: 12px;
    }
    .clay-pwd-toggle {
      background: transparent;
      border: none;
      font-size: 14px;
      color: #8c71aa;
      cursor: pointer;
      padding: 3px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Auxiliary Links */
    .clay-aux-links {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 6px 4px 8px;
      font-size: 11px;
    }
    .clay-remember-wrap {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--clay-text-muted);
      cursor: pointer;
      font-weight: 600;
    }
    .clay-remember-wrap input {
      accent-color: var(--clay-primary);
      width: 13px;
      height: 13px;
      cursor: pointer;
    }
    .clay-forgot-link {
      color: var(--clay-primary);
      font-weight: 800;
      text-decoration: none;
    }
    .clay-forgot-link:hover {
      text-decoration: underline;
    }

    /* Main Submit Button */
    .clay-btn-main {
      width: 100%;
      height: 40px;
      border-radius: 999px;
      background: var(--clay-primary-grad);
      color: #ffffff;
      border: none;
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 850;
      cursor: pointer;
      box-shadow: var(--clay-shadow-btn);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .clay-btn-main:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(139, 92, 246, 0.45);
    }
    .clay-btn-main:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Loading Spinner */
    .btn-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: inline-block;
      flex-shrink: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Status Alert Message */
    .form-status {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 700;
      min-height: 14px;
      color: var(--clay-text-muted);
      padding: 4px 6px;
      border-radius: 6px;
      text-align: center;
    }
    .form-status.error {
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #fee2e2;
    }
    .form-status.success {
      color: #15803d;
      background: #f0fdf4;
      border: 1px solid #dcfce7;
    }

    /* Divider */
    .clay-divider-line {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 8px 0;
      color: #9f86bb;
      font-size: 10px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .clay-divider-line::before,
    .clay-divider-line::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #eae2f5;
    }
    .clay-divider-line span {
      padding: 0 6px;
    }

    /* Official Google Mount Container (Pristine Single Google GIS Container) */
    .gsi-mount-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 4px 0 8px;
      width: 100%;
      min-height: 40px;
    }
    #gsiButtonContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 40px;
    }

    /* Footer Switch Link */
    .clay-footer-link {
      font-size: 11.5px;
      color: var(--clay-text-muted);
      font-weight: 600;
    }
    .clay-footer-link a {
      color: var(--clay-primary);
      font-weight: 850;
      text-decoration: none;
      margin-left: 3px;
    }

    /* Confetti Particle */
    .success-confetti-particle {
      position: fixed;
      pointer-events: none;
      z-index: 100000;
      font-size: 18px;
      animation: confettiBurst 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }
    @keyframes confettiBurst {
      0% { opacity: 1; transform: translate(0, 0) scale(0.5); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.3) rotate(var(--dr)); }
    }
  </style>
</head>

<body class="vanvi-auth-body" id="authBody">

  <!-- Ambient Floating Background Props -->
  <div class="clay-studio-props" aria-hidden="true">
    <div class="clay-prop prop-cloud-1">☁️</div>
    <div class="clay-prop prop-cloud-2">☁️</div>
    <div class="clay-prop prop-heart-float">💖</div>
    <div class="clay-prop prop-star-float">✨</div>
  </div>

  <!-- Smart Fixed Back Button -->
  <a class="clay-nav-back" href="javascript:void(0)" onclick="vanviGoBack('index.html')" aria-label="Back to home">
    <span class="back-arrow" aria-hidden="true">‹</span>
    <span>Back</span>
  </a>

  <!-- Mode Switcher -->
  <div class="clay-mode-switch-wrap">
    <nav class="clay-mode-switch" aria-label="Auth tabs">
      <a href="login.html" class="clay-mode-tab active" aria-current="page">
        <span>🔑</span>
        <span>Sign In</span>
      </a>
      <a href="signup.html" class="clay-mode-tab">
        <span>✨</span>
        <span>Sign Up</span>
        <span class="clay-coins-tag">+100 🪙</span>
      </a>
    </nav>
  </div>

  <!-- Master Compact Phone Card (~375px wide centered) -->
  <main class="clay-phone-card" id="authStage" role="main">

    <!-- Top Greeting Section -->
    <header class="clay-header-top">
      <div class="clay-heart-emblem" aria-hidden="true">💖</div>
      <h1 class="clay-main-title" id="loginTitle">
        <span>Welcome Back</span>
      </h1>
      <p class="clay-sub-text">Login to continue your celebration journey</p>
    </header>

    <!-- 3D Cute Clay Character -->
    <div class="clay-girl-stage" aria-hidden="true">
      <img src="assets/vanvi-clay-girl-login.jpg" alt="Cute Vanvi Moments 3D Girl" class="clay-girl-photo" loading="eager" />
    </div>

    <!-- Elevated Inner White Clay Form Card -->
    <section class="clay-inner-card" aria-label="Sign in credentials">
      <form id="loginForm" novalidate>

        <!-- Email or Mobile Field -->
        <div class="clay-field-row">
          <div class="clay-pill-input-box">
            <div class="clay-icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
            </div>
            <input class="clay-native-input" id="loginEmail" name="email" type="text" placeholder="Email or Mobile Number" autocomplete="username" required aria-label="Email or Mobile Number" />
          </div>
        </div>

        <!-- Password Field -->
        <div class="clay-field-row">
          <div class="clay-pill-input-box">
            <div class="clay-icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
              </svg>
            </div>
            <input class="clay-native-input" id="loginPassword" name="password" type="password" placeholder="Password" autocomplete="current-password" required aria-label="Password" />
            <button type="button" class="clay-pwd-toggle" id="btnTogglePwd" title="Show/Hide Password" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <!-- Auxiliary Links: Remember me & Forgot Password -->
        <div class="clay-aux-links">
          <label class="clay-remember-wrap">
            <input type="checkbox" id="rememberMe" checked />
            <span>Remember me</span>
          </label>
          <a class="clay-forgot-link" href="forgot-password.html">Forgot Password?</a>
        </div>

        <!-- Tactile 3D Clay Login Button -->
        <button class="clay-btn-main" type="submit" id="btnLoginSubmit">
          <span class="btn-spinner" id="loginSpinner" style="display:none;" aria-hidden="true"></span>
          <span id="loginBtnText">Sign In</span>
        </button>

        <!-- Status Alert Message -->
        <p id="loginStatus" class="form-status" role="status" aria-live="polite" style="display:none;"></p>
      </form>

      <!-- Divider -->
      <div class="clay-divider-line">
        <span>or continue with</span>
      </div>

      <!-- Real Official Google Sign-In Container (NO DUPLICATE BUTTON) -->
      <div class="gsi-mount-wrap">
        <div id="gsiButtonContainer"></div>
      </div>

      <!-- Bottom Switch Link -->
      <p class="clay-footer-link">
        Don't have an account? <a href="signup.html">Sign Up (+100 🪙 free)</a>
      </p>
    </section>
  </main>

  <!-- Central Client API, Google Auth & Navigation Scripts -->
  <script src="js/vanvi-api.js"></script>
  <script src="js/vanvi-google-auth.js"></script>
  <script src="js/vanvi-i18n.js"></script>

  <script>
    function vanviGoBack(fallbackUrl) {
      if (window.history.length > 1 && document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
        window.history.back();
      } else {
        window.location.href = fallbackUrl || 'index.html';
      }
    }

    (function () {
      'use strict';

      const form = document.getElementById('loginForm');
      const status = document.getElementById('loginStatus');
      const authStage = document.getElementById('authStage');
      const btnTogglePwd = document.getElementById('btnTogglePwd');
      const pwdInput = document.getElementById('loginPassword');
      const emailInput = document.getElementById('loginEmail');
      const rememberCheckbox = document.getElementById('rememberMe');
      const btnSubmit = document.getElementById('btnLoginSubmit');
      const spinner = document.getElementById('loginSpinner');
      const btnText = document.getElementById('loginBtnText');

      // Auto-fill remembered identifier
      try {
        const remembered = localStorage.getItem('vanvi_remember_identifier') || localStorage.getItem('vanvi_last_email');
        if (remembered) {
          emailInput.value = remembered;
          if (rememberCheckbox) rememberCheckbox.checked = true;
        }
      } catch (e) {}

      // Handle redirect status message (e.g. from password reset)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('reset') === 'success') {
        showStatus('✓ Password updated successfully! Please sign in with your new password.', 'success');
      }

      function showStatus(msg, type) {
        if (!status) return;
        if (!msg) {
          status.style.display = 'none';
          status.textContent = '';
          return;
        }
        status.style.display = 'block';
        status.textContent = msg;
        status.className = 'form-status ' + (type || '');
      }

      function setLoading(isLoading) {
        if (btnSubmit) btnSubmit.disabled = isLoading;
        if (spinner) spinner.style.display = isLoading ? 'inline-block' : 'none';
        if (btnText) btnText.textContent = isLoading ? 'Signing in...' : 'Sign In';
      }

      // Password Visibility Toggle
      btnTogglePwd?.addEventListener('click', () => {
        if (pwdInput.type === 'password') {
          pwdInput.type = 'text';
          btnTogglePwd.textContent = '🔒';
          btnTogglePwd.setAttribute('aria-label', 'Hide password');
        } else {
          pwdInput.type = 'password';
          btnTogglePwd.textContent = '👁️';
          btnTogglePwd.setAttribute('aria-label', 'Show password');
        }
      });

      // Celebration Confetti Sequence
      window.triggerAuthSuccessCelebration = function (redirectUrl) {
        const emojis = ['✨', '🪙', '✦', '⭐', '💫', '🌟'];
        const cardRect = (authStage || document.body).getBoundingClientRect();
        const centerX = cardRect.left + cardRect.width / 2;
        const centerY = cardRect.top + cardRect.height / 2;

        for (let i = 0; i < 24; i++) {
          const p = document.createElement('div');
          p.className = 'success-confetti-particle';
          p.textContent = emojis[i % emojis.length];
          const angle = (i / 24) * 2 * Math.PI;
          const dist = 80 + Math.random() * 150;
          const dx = Math.cos(angle) * dist + 'px';
          const dy = Math.sin(angle) * dist + 'px';
          const dr = (Math.random() * 720 - 360) + 'deg';
          p.style.setProperty('--dx', dx);
          p.style.setProperty('--dy', dy);
          p.style.setProperty('--dr', dr);
          p.style.left = centerX + 'px';
          p.style.top = centerY + 'px';
          document.body.appendChild(p);
          setTimeout(() => p.remove(), 900);
        }

        setTimeout(() => {
          window.location.href = redirectUrl || 'dashboard.html';
        }, 750);
      };

      // Real Live API Login Form Submission
      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        showStatus('');

        const identifier = emailInput.value.trim();
        const password = pwdInput.value;

        if (!identifier) {
          showStatus('Please enter your registered email or mobile number.', 'error');
          emailInput.focus();
          return;
        }

        if (!password) {
          showStatus('Please enter your password.', 'error');
          pwdInput.focus();
          return;
        }

        setLoading(true);

        try {
          const result = await window.VanviAPI.auth.login({ identifier, password });
          if (result.success) {
            if (rememberCheckbox && rememberCheckbox.checked) {
              localStorage.setItem('vanvi_remember_identifier', identifier);
              localStorage.setItem('vanvi_remember_me', 'true');
            } else {
              localStorage.removeItem('vanvi_remember_identifier');
              localStorage.removeItem('vanvi_remember_me');
            }

            showStatus('Welcome back! Opening your celebration dashboard... ✨', 'success');
            const redirectUrl = new URLSearchParams(location.search).get('redirect') || 'dashboard.html';
            window.triggerAuthSuccessCelebration(redirectUrl);
            return;
          }

          setLoading(false);
          showStatus(result.error || 'Invalid credentials. Please try again.', 'error');
        } catch (err) {
          setLoading(false);
          showStatus('Network connection error. Please try again.', 'error');
        }
      });

      // Render official Google button into #gsiButtonContainer
      function mountGoogleBtn() {
        if (window.VanviGoogleAuth && window.VanviGoogleAuth.renderButton) {
          window.VanviGoogleAuth.renderButton('gsiButtonContainer', {
            theme: 'outline',
            size: 'large',
            shape: 'pill',
            text: 'signin_with',
            width: 300
          });
        }
      }
      window.addEventListener('load', mountGoogleBtn);
      if (document.readyState === 'complete') mountGoogleBtn();

    })();
  </script>

  <script src="js/vanvi-navigation.js"></script>
