<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem('vanvi_aesthetic_theme')||'clay';var f=localStorage.getItem('vanvi_font_pref')||'royal';document.documentElement.setAttribute('data-vanvi-theme',t);document.documentElement.setAttribute('data-vanvi-font',f);}catch(e){}})();</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5.0, user-scalable=yes" />
  <title>Create Account | Vanvi Moments</title>
  <meta name="description" content="Join Vanvi Moments to craft custom digital celebration invitations and receive 100 free celebration coins." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vanvi-inner-light.css" />
  <link rel="stylesheet" href="vanvi-navigation.css" />
  <link rel="stylesheet" href="css/vanvi-global-experience.css" />

  <!-- Google Identity Services Official Client -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      /* Ultra-Vibrant Sunset Rose, Electric Fuchsia & Celebration Gold */
      --clay-bg-grad: radial-gradient(circle at 10% 15%, rgba(244, 63, 94, 0.45) 0%, transparent 45%),
                      radial-gradient(circle at 90% 12%, rgba(217, 70, 239, 0.4) 0%, transparent 45%),
                      radial-gradient(circle at 50% 90%, rgba(245, 158, 11, 0.35) 0%, transparent 45%),
                      radial-gradient(circle at 80% 80%, rgba(225, 29, 72, 0.35) 0%, transparent 50%),
                      linear-gradient(135deg, #ffe4e6 0%, #fce7f3 35%, #fed7aa 70%, #fef3c7 100%);
      --clay-primary: #e11d48;
      --clay-primary-dark: #be123c;
      --clay-primary-grad: linear-gradient(135deg, #f43f5e 0%, #e11d48 40%, #c026d3 100%);
      --clay-input-bg: #fff5f7;
      --clay-text-dark: #3f0717;
      --clay-text-muted: #881337;
      --clay-shadow-card: 0 25px 65px -12px rgba(225, 29, 72, 0.28), 0 8px 24px -4px rgba(192, 38, 211, 0.16), 0 0 0 1.5px rgba(255, 255, 255, 0.95), inset 0 2px 2px #ffffff;
      --clay-shadow-inner: 0 8px 24px rgba(225, 29, 72, 0.08), inset 0 2px 2px #ffffff;
      --clay-shadow-btn: 0 10px 24px -4px rgba(225, 29, 72, 0.45), 0 3px 0 #9f1239, inset 0 2px 2px rgba(255, 255, 255, 0.8), inset 0 -2px 3px rgba(0, 0, 0, 0.16);
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--clay-bg-grad);
      background-attachment: fixed;
      font-family: var(--font-sans);
      color: var(--clay-text-dark);
      overflow-x: hidden !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 12px;
      position: relative;
    }

    /* Ambient Luxury Glowing Background Props */
    .clay-studio-props {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .luxe-glow-orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      will-change: transform;
    }
    .luxe-glow-orb-1 {
      top: -60px;
      left: -60px;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(244, 63, 94, 0.42) 0%, rgba(217, 70, 239, 0.2) 60%, transparent 80%);
      filter: blur(60px);
      animation: driftGlow1 16s ease-in-out infinite alternate;
    }
    .luxe-glow-orb-2 {
      bottom: -60px;
      right: -60px;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.38) 0%, rgba(225, 29, 72, 0.25) 60%, transparent 80%);
      filter: blur(65px);
      animation: driftGlow2 20s ease-in-out infinite alternate;
    }
    .clay-prop-star {
      position: absolute;
      font-weight: 900;
      user-select: none;
      animation: sparkle 3.5s ease-in-out infinite alternate;
    }
    .star-1 { top: 12%; left: 14%; font-size: 24px; color: #f43f5e; text-shadow: 0 0 16px rgba(244, 63, 94, 0.6); }
    .star-2 { top: 16%; right: 15%; font-size: 22px; color: #c026d3; text-shadow: 0 0 16px rgba(192, 38, 211, 0.6); animation-delay: -1.2s; }
    .star-3 { bottom: 18%; left: 16%; font-size: 26px; color: #f59e0b; text-shadow: 0 0 16px rgba(245, 158, 11, 0.6); animation-delay: -2s; }
    .star-4 { bottom: 15%; right: 18%; font-size: 20px; color: #fb7185; text-shadow: 0 0 16px rgba(251, 113, 133, 0.6); animation-delay: -0.7s; }

    @keyframes driftGlow1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 40px) scale(1.12); }
    }
    @keyframes driftGlow2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-35px, -30px) scale(1.1); }
    }
    @keyframes sparkle {
      0% { opacity: 0.45; transform: scale(0.9) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.15) rotate(15deg); }
      100% { opacity: 0.45; transform: scale(0.9) rotate(0deg); }
    }

    /* Fixed Back Button */
    .clay-nav-back {
      position: fixed;
      top: 16px;
      left: 18px;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      min-height: 38px;
      border-radius: 999px;
      background: #ffffff;
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 8px 24px rgba(225, 29, 72, 0.14), inset 0 2px 2px #ffffff;
      color: #3b0718;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 850;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .clay-nav-back:hover {
      transform: translateX(-3px) scale(1.03);
      color: var(--clay-primary);
      box-shadow: 0 12px 28px rgba(225, 29, 72, 0.25);
    }
    .clay-nav-back .back-arrow {
      font-size: 16px;
      line-height: 1;
      font-weight: 900;
    }

    /* Top Mode Switcher Bar */
    .clay-mode-switch-wrap {
      width: 100%;
      max-width: 395px;
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
      position: relative;
      z-index: 10;
    }
    .clay-mode-switch {
      display: inline-flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 4px;
      border-radius: 999px;
      box-shadow: 0 6px 18px rgba(225, 29, 72, 0.1), inset 0 1px 2px #fff;
      border: 1px solid rgba(255, 255, 255, 0.95);
      gap: 4px;
    }
    .clay-mode-tab {
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      color: var(--clay-text-muted);
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .clay-mode-tab.active {
      background: var(--clay-primary);
      background-image: var(--clay-primary-grad);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.35);
    }

    /* Master Floating Center Card (~395px compact on laptop & mobile) */
    .clay-phone-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 395px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-radius: 32px;
      box-shadow: var(--clay-shadow-card);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      padding: 14px 14px 12px;
      margin: 0 auto;
      text-align: center;
      overflow: hidden;
      animation: cardPopEnter 0.38s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardPopEnter {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Top Greeting Section with Compact Luxury Avatar */
    .clay-header-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 5px;
    }
    .clay-avatar-bubble {
      position: relative;
      width: 54px;
      height: 54px;
      margin: 0 auto 4px;
      border-radius: 50%;
      padding: 2.5px;
      background: var(--clay-primary-grad);
      box-shadow: 0 8px 20px rgba(225, 29, 72, 0.28), 0 0 0 2px rgba(255, 255, 255, 0.95);
      animation: avatarFloat 4s ease-in-out infinite alternate;
    }
    @keyframes avatarFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-3px); }
    }
    .clay-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #ffffff;
    }
    .clay-avatar-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      font-size: 13px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }
    .clay-main-title {
      font-size: 21px;
      font-weight: 900;
      color: var(--clay-text-dark);
      letter-spacing: -0.3px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin: 0;
    }
    .clay-sub-text {
      font-size: 11.5px;
      color: var(--clay-text-muted);
      margin-top: 2px;
      font-weight: 600;
    }

    /* Inner Elevated White Clay Form Card */
    .clay-inner-card {
      position: relative;
      z-index: 4;
      background: #ffffff;
      border-radius: 26px;
      padding: 12px 12px 10px;
      box-shadow: var(--clay-shadow-inner);
      border: 1.5px solid rgba(254, 226, 235, 0.95);
    }

    /* Compact Inset Input Rows */
    .clay-field-row {
      margin-bottom: 7px;
      position: relative;
      text-align: left;
    }
    .clay-pill-input-box {
      width: 100%;
      min-height: 42px;
      background: var(--clay-input-bg);
      border-radius: 999px;
      box-shadow: inset 0 2px 4px rgba(225, 29, 72, 0.08), inset 0 1px 2px rgba(0,0,0,0.03);
      display: flex;
      align-items: center;
      padding: 3px 6px 3px 5px;
      transition: all 0.2s ease;
      border: 1.5px solid transparent;
    }
    .clay-pill-input-box:focus-within {
      background: #ffffff;
      border-color: var(--clay-primary);
      box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.2), inset 0 1px 2px #fff;
    }
    .clay-icon-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fb7185 0%, #e11d48 100%);
      color: #ffffff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: 0 3px 8px rgba(225, 29, 72, 0.3), inset 0 1px 2px rgba(255,255,255,0.7);
    }
    .clay-icon-circle svg {
      width: 14px;
      height: 14px;
    }
    .clay-native-input {
      flex: 1;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      padding: 0 9px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      color: var(--clay-text-dark);
      min-width: 0;
    }
    .clay-native-input::placeholder {
      color: #b88698;
      font-weight: 500;
      font-size: 12.5px;
    }
    .clay-pwd-toggle {
      background: transparent;
      border: none;
      font-size: 15px;
      color: #a26982;
      cursor: pointer;
      padding: 4px 8px;
      transition: transform 0.2s ease, color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .clay-pwd-toggle:hover {
      transform: scale(1.15);
      color: var(--clay-primary);
    }

    /* Live Password Strength Meter */
    .strength-meter-wrap {
      margin: -2px 6px 8px;
    }
    .strength-bar-track {
      display: flex;
      gap: 4px;
      height: 3.5px;
      width: 100%;
      margin-bottom: 4px;
    }
    .strength-bar-segment {
      flex: 1;
      height: 100%;
      background: #f1e2e8;
      border-radius: 99px;
      transition: background 0.3s ease;
    }
    .strength-text-row {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--clay-text-muted);
    }
    .strength-score-label {
      font-weight: 800;
      text-transform: capitalize;
    }

    /* Password Match Status Pill */
    .pwd-match-hint {
      font-size: 10.5px;
      font-weight: 700;
      margin: -2px 6px 8px;
      display: none;
    }
    .pwd-match-hint.match {
      color: #15803d;
      display: block;
    }
    .pwd-match-hint.mismatch {
      color: #dc2626;
      display: block;
    }

    /* Terms Acceptance Checkbox */
    .clay-terms-wrap {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      margin: 6px 4px 8px;
      font-size: 11px;
      color: var(--clay-text-muted);
      cursor: pointer;
      text-align: left;
      line-height: 1.35;
      user-select: none;
    }
    .clay-terms-wrap input {
      accent-color: var(--clay-primary);
      width: 14px;
      height: 14px;
      margin-top: 1px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .clay-terms-wrap a {
      color: var(--clay-primary);
      font-weight: 800;
      text-decoration: underline;
    }

    /* Primary Action Button */
    .clay-btn-main {
      width: 100%;
      min-height: 44px;
      border-radius: 999px;
      background: var(--clay-primary-grad);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.65);
      font-family: var(--font-sans);
      font-size: 14.5px;
      font-weight: 850;
      letter-spacing: 0.2px;
      cursor: pointer;
      box-shadow: var(--clay-shadow-btn);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .clay-btn-main:hover {
      transform: translateY(-2px) scale(1.015);
      box-shadow: 0 12px 26px rgba(244, 63, 94, 0.5), 0 4px 0 #be123c;
    }
    .clay-btn-main:active {
      transform: translateY(2px) scale(0.985);
      box-shadow: 0 4px 10px rgba(244, 63, 94, 0.3), 0 1px 0 #be123c;
    }
    .clay-btn-main:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Loading Spinner */
    .btn-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: inline-block;
      flex-shrink: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Status Alert Message */
    .form-status {
      margin-top: 6px;
      font-size: 11.5px;
      font-weight: 700;
      min-height: 16px;
      color: var(--clay-text-muted);
      padding: 5px 8px;
      border-radius: 8px;
      transition: all 0.2s ease;
      text-align: center;
    }
    .form-status.error {
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #fee2e2;
    }
    .form-status.success {
      color: #15803d;
      background: #f0fdf4;
      border: 1px solid #dcfce7;
    }
    .form-status a {
      color: inherit;
      text-decoration: underline;
      font-weight: 850;
    }

    /* Divider */
    .clay-divider-line {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 8px 0;
      color: #b88698;
      font-size: 10px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .clay-divider-line::before,
    .clay-divider-line::after {
      content: '';
      flex: 1;
      border-bottom: 1.5px solid #fed7e2;
    }
    .clay-divider-line span {
      padding: 0 8px;
    }

    /* Official Google Mount Container (Single Pristine Official GSI Button) */
    .gsi-mount-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 6px 0 10px;
      min-height: 44px;
      width: 100%;
    }
    #gsiButtonContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 44px;
    }
    #gsiButtonContainer > div,
    #gsiButtonContainer iframe {
      margin: 0 auto !important;
      max-width: 100% !important;
    }

    /* Footer Switch Link */
    .clay-footer-link {
      font-size: 12px;
      color: var(--clay-text-muted);
      font-weight: 600;
    }
    .clay-footer-link a {
      color: var(--clay-primary);
      font-weight: 850;
      text-decoration: none;
      margin-left: 4px;
    }
    .clay-footer-link a:hover {
      text-decoration: underline;
    }

    /* Confetti Particle */
    .success-confetti-particle {
      position: fixed;
      pointer-events: none;
      z-index: 100000;
      font-size: 20px;
      animation: confettiBurst 0.9s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }
    @keyframes confettiBurst {
      0% { opacity: 1; transform: translate(0, 0) scale(0.5); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.4) rotate(var(--dr)); }
    }

    /* Responsive Adaptations */
    /* ==========================================================================
       LAPTOP & DESKTOP BOUTIQUE COMPACT LUXURY EXPERIENCE
       Sleek, small centered jewel card with balanced negative space
       ========================================================================== */
    @media (min-width: 601px) {
      body {
        padding: 16px;
        justify-content: center;
        min-height: 100vh;
      }
      .clay-mode-switch-wrap {
        max-width: 345px;
        margin-bottom: 5px;
      }
      .clay-mode-tab {
        padding: 4px 13px;
        font-size: 11px;
      }
      .clay-phone-card {
        max-width: 345px;
        padding: 11px 13px 10px;
        border-radius: 26px;
        box-shadow: 0 18px 45px -10px rgba(225, 29, 72, 0.2), 0 4px 14px -2px rgba(245, 158, 11, 0.1), 0 0 0 1.5px rgba(255, 255, 255, 0.95);
      }
      .clay-header-top {
        margin-bottom: 3px;
      }
      .clay-avatar-bubble {
        width: 42px;
        height: 42px;
        margin: 0 auto 2px;
        padding: 2px;
      }
      .clay-avatar-badge {
        font-size: 10px;
        bottom: -2px;
        right: -2px;
      }
      .clay-main-title {
        font-size: 18px;
        gap: 4px;
      }
      .clay-sub-text {
        font-size: 10px;
        margin-top: 1px;
      }
      .clay-gift-bonus-strip {
        padding: 3px 8px;
        font-size: 9.5px;
        margin-bottom: 6px;
      }
      .clay-inner-card {
        padding: 10px 11px 9px;
        border-radius: 20px;
      }
      .clay-field-row {
        margin-bottom: 5px;
      }
      .clay-pill-input-box {
        min-height: 36px;
        padding: 2px 5px 2px 4px;
      }
      .clay-icon-circle {
        width: 28px;
        height: 28px;
      }
      .clay-icon-circle svg {
        width: 12px;
        height: 12px;
      }
      .clay-native-input {
        font-size: 11.5px;
        padding: 0 7px;
      }
      .clay-native-input::placeholder {
        font-size: 11px;
      }
      .clay-pwd-toggle {
        font-size: 12.5px;
        padding: 2px 5px;
      }
      .clay-terms-wrap {
        margin: 4px 2px 6px;
        font-size: 10px;
      }
      .clay-terms-wrap input {
        width: 12px;
        height: 12px;
      }
      .clay-btn-main {
        min-height: 36px;
        font-size: 12.5px;
        font-weight: 850;
      }
      .clay-divider-line {
        margin: 5px 0 4px;
        font-size: 9px;
      }
      .gsi-mount-wrap {
        margin: 3px 0 4px;
        min-height: 36px;
      }
      #gsiButtonContainer {
        min-height: 36px;
      }
      .clay-footer-link {
        font-size: 10.5px;
        margin-top: 3px;
      }
    }

    @media (max-width: 860px) {
      .prop-potted-plant,
      .prop-potted-flower {
        display: none !important;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 50px 10px 20px;
        justify-content: flex-start;
      }
      .clay-nav-back {
        top: 10px;
        left: 10px;
        padding: 5px 12px;
        min-height: 34px;
        font-size: 11.5px;
      }
      .clay-phone-card {
        padding: 14px 12px 12px;
        border-radius: 28px;
      }
      .clay-main-title {
        font-size: 20px;
      }
      .clay-girl-stage {
        max-width: 105px;
        margin-bottom: -14px;
      }
      .clay-inner-card {
        padding: 14px 10px 10px;
        border-radius: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body class="vanvi-auth-body" id="authBody">

  <!-- Ambient 3D Luxury Cosmic Aurora Glowing Props -->
  <div class="clay-studio-props" aria-hidden="true">
    <div class="luxe-glow-orb luxe-glow-orb-1"></div>
    <div class="luxe-glow-orb luxe-glow-orb-2"></div>
    <div class="clay-prop-star star-1">✦</div>
    <div class="clay-prop-star star-2">✨</div>
    <div class="clay-prop-star star-3">⭐</div>
    <div class="clay-prop-star star-4">✦</div>
  </div>

  <!-- Smart Fixed Back Button -->
  <a class="clay-nav-back" href="javascript:void(0)" onclick="vanviGoBack('index.html')" aria-label="Back to home">
    <span class="back-arrow" aria-hidden="true">‹</span>
    <span>Back</span>
  </a>

  <!-- Mode Switcher -->
  <div class="clay-mode-switch-wrap">
    <nav class="clay-mode-switch" aria-label="Auth tabs">
      <a href="login.html" class="clay-mode-tab">
        <span>🔑</span>
        <span>Sign In</span>
      </a>
      <a href="signup.html" class="clay-mode-tab active" aria-current="page">
        <span>✨</span>
        <span>Sign Up</span>
      </a>
    </nav>
  </div>

  <!-- Master Floating Center Card (~395px wide centered on desktop & mobile) -->
  <main class="clay-phone-card" id="authStage" role="main">

    <!-- Top Greeting Section with Compact Luxury Avatar -->
    <header class="clay-header-top">
      <div class="clay-avatar-bubble" aria-hidden="true">
        <img src="assets/vanvi-clay-girl-signup.jpg" alt="Vanvi Moments" class="clay-avatar-img" />
        <span class="clay-avatar-badge">✨</span>
      </div>
      <h1 class="clay-main-title" id="signupTitle">
        <span>Create Account</span>
      </h1>
      <p class="clay-sub-text">Join Vanvi Moments & start celebrating</p>
    </header>

    <!-- Elevated Inner White Clay Form Card -->
    <section class="clay-inner-card" aria-label="Registration credentials">
      <form id="signupForm" novalidate>

        <!-- Full Name Field -->
        <div class="clay-field-row">
          <div class="clay-pill-input-box">
            <div class="clay-icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
            </div>
            <input class="clay-native-input" id="signupName" name="name" type="text" placeholder="Full Name" autocomplete="name" required aria-label="Full Name" />
          </div>
        </div>

        <!-- Email Address Field -->
        <div class="clay-field-row">
          <div class="clay-pill-input-box">
            <div class="clay-icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
              </svg>
            </div>
            <input class="clay-native-input" id="signupEmail" name="email" type="email" placeholder="Email Address" autocomplete="email" required aria-label="Email Address" />
          </div>
        </div>

        <!-- Mobile Number Field (Optional/Supported) -->
        <div class="clay-field-row">
          <div class="clay-pill-input-box">
            <div class="clay-icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
              </svg>
            </div>
            <input class="clay-native-input" id="signupPhone" name="phone" type="tel" placeholder="Mobile Number (optional)" autocomplete="tel" aria-label="Mobile Number" />
          </div>
        </div>

        <!-- Password Field -->
        <div class="clay-field-row">
          <div class="clay-pill-input-box">
            <div class="clay-icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
              </svg>
            </div>
            <input class="clay-native-input" id="signupPassword" name="password" type="password" placeholder="Create Password (min 6 chars)" autocomplete="new-password" required aria-label="Password" />
            <button type="button" class="clay-pwd-toggle" id="btnTogglePwd" title="Show/Hide Password" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <!-- Live Password Strength Meter -->
        <div class="strength-meter-wrap" id="strengthMeterWrap">
          <div class="strength-bar-track">
            <div class="strength-bar-segment" id="strengthSeg1"></div>
            <div class="strength-bar-segment" id="strengthSeg2"></div>
            <div class="strength-bar-segment" id="strengthSeg3"></div>
          </div>
          <div class="strength-text-row">
            <span>Strength: <span class="strength-score-label" id="strengthLabel">Enter password</span></span>
            <span id="strengthHint">Min 6 characters</span>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="clay-field-row">
          <div class="clay-pill-input-box">
            <div class="clay-icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
              </svg>
            </div>
            <input class="clay-native-input" id="signupConfirmPassword" name="confirmPassword" type="password" placeholder="Confirm Password" autocomplete="new-password" required aria-label="Confirm Password" />
            <button type="button" class="clay-pwd-toggle" id="btnToggleConfirmPwd" title="Show/Hide Confirm Password" aria-label="Toggle confirm password visibility">👁️</button>
          </div>
        </div>
        <div class="pwd-match-hint" id="pwdMatchHint"></div>

        <!-- Terms Acceptance Checkbox -->
        <label class="clay-terms-wrap">
          <input type="checkbox" id="agreeTerms" required />
          <span>I accept the <a href="terms.html" target="_blank">Terms</a> & <a href="privacy.html" target="_blank">Privacy Policy</a></span>
        </label>

        <!-- Primary Submit Button -->
        <button class="clay-btn-main" type="submit" id="btnSignupSubmit">
          <span class="btn-spinner" id="signupSpinner" style="display:none;" aria-hidden="true"></span>
          <span id="signupBtnText">Create Account ✨</span>
        </button>

        <!-- Status Alert Message -->
        <p id="signupStatus" class="form-status" role="status" aria-live="polite" style="display:none;"></p>
      </form>

      <!-- Single Official Google Authentication Section -->
      <div class="clay-divider-line">
        <span>or continue with</span>
      </div>

      <div class="gsi-mount-wrap" id="gsiMountWrap">
        <div id="gsiButtonContainer" class="g_id_signin" data-type="standard" data-shape="pill" data-theme="outline" data-text="continue_with" data-size="large" data-logo_alignment="left" data-width="290"></div>
      </div>

      <!-- Bottom Switch Link -->
      <p class="clay-footer-link">
        Already have an account? <a href="login.html">Sign In</a>
      </p>
    </section>
  </main>

  <!-- Central Client API, Google Auth & Navigation Scripts -->
  <script src="js/vanvi-api.js"></script>
  <script src="js/vanvi-google-auth.js"></script>
  <script src="js/vanvi-i18n.js"></script>

  <script>
    // Universal safe back navigation helper
    function vanviGoBack(fallbackUrl) {
      if (window.history.length > 1 && document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
        window.history.back();
      } else {
        window.location.href = fallbackUrl || 'index.html';
      }
    }

    (function () {
      'use strict';

      const form = document.getElementById('signupForm');
      const status = document.getElementById('signupStatus');
      const authStage = document.getElementById('authStage');
      const btnTogglePwd = document.getElementById('btnTogglePwd');
      const btnToggleConfirmPwd = document.getElementById('btnToggleConfirmPwd');
      const pwdInput = document.getElementById('signupPassword');
      const confirmPwdInput = document.getElementById('signupConfirmPassword');
      const nameInput = document.getElementById('signupName');
      const emailInput = document.getElementById('signupEmail');
      const phoneInput = document.getElementById('signupPhone');
      const termsCheckbox = document.getElementById('agreeTerms');
      const btnSubmit = document.getElementById('btnSignupSubmit');
      const spinner = document.getElementById('signupSpinner');
      const btnText = document.getElementById('signupBtnText');
      const matchHint = document.getElementById('pwdMatchHint');

      // Strength Meter Elements
      const seg1 = document.getElementById('strengthSeg1');
      const seg2 = document.getElementById('strengthSeg2');
      const seg3 = document.getElementById('strengthSeg3');
      const strengthLabel = document.getElementById('strengthLabel');
      const strengthHint = document.getElementById('strengthHint');

      function showStatus(msg, type, isHtml) {
        if (!status) return;
        if (!msg) {
          status.style.display = 'none';
          status.textContent = '';
          return;
        }
        status.style.display = 'block';
        if (isHtml) {
          status.innerHTML = msg;
        } else {
          status.textContent = msg;
        }
        status.className = 'form-status ' + (type || '');
      }

      function setLoading(isLoading) {
        if (btnSubmit) btnSubmit.disabled = isLoading;
        if (spinner) spinner.style.display = isLoading ? 'inline-block' : 'none';
        if (btnText) btnText.textContent = isLoading ? 'Creating...' : 'Create Account (+100 🪙) ✨';
      }

      // Password Visibility Toggles
      btnTogglePwd?.addEventListener('click', () => {
        if (pwdInput.type === 'password') {
          pwdInput.type = 'text';
          btnTogglePwd.textContent = '🔒';
        } else {
          pwdInput.type = 'password';
          btnTogglePwd.textContent = '👁️';
        }
      });

      btnToggleConfirmPwd?.addEventListener('click', () => {
        if (confirmPwdInput.type === 'password') {
          confirmPwdInput.type = 'text';
          btnToggleConfirmPwd.textContent = '🔒';
        } else {
          confirmPwdInput.type = 'password';
          btnToggleConfirmPwd.textContent = '👁️';
        }
      });

      // Live Password Strength Calculation
      function checkPasswordStrength(val) {
        if (!val) {
          seg1.style.background = '#f1e2e8';
          seg2.style.background = '#f1e2e8';
          seg3.style.background = '#f1e2e8';
          strengthLabel.textContent = 'Enter password';
          strengthLabel.style.color = 'var(--clay-text-muted)';
          strengthHint.textContent = 'Min 6 characters';
          return 0;
        }

        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 8 && /[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
        if (/[0-9]/.test(val) && /[^A-Za-z0-9]/.test(val)) score++;

        if (score === 1) {
          seg1.style.background = '#ef4444';
          seg2.style.background = '#f1e2e8';
          seg3.style.background = '#f1e2e8';
          strengthLabel.textContent = 'Weak';
          strengthLabel.style.color = '#ef4444';
          strengthHint.textContent = 'Add uppercase & numbers';
        } else if (score === 2) {
          seg1.style.background = '#f59e0b';
          seg2.style.background = '#f59e0b';
          seg3.style.background = '#f1e2e8';
          strengthLabel.textContent = 'Fair';
          strengthLabel.style.color = '#d97706';
          strengthHint.textContent = 'Add a symbol (e.g. !@#$)';
        } else if (score >= 3) {
          seg1.style.background = '#10b981';
          seg2.style.background = '#10b981';
          seg3.style.background = '#10b981';
          strengthLabel.textContent = 'Strong ✨';
          strengthLabel.style.color = '#059669';
          strengthHint.textContent = 'Great password!';
        }

        return score;
      }

      pwdInput.addEventListener('input', () => {
        checkPasswordStrength(pwdInput.value);
        checkPasswordMatch();
      });

      function checkPasswordMatch() {
        const p1 = pwdInput.value;
        const p2 = confirmPwdInput.value;
        if (!p2) {
          matchHint.style.display = 'none';
          return;
        }
        if (p1 === p2) {
          matchHint.className = 'pwd-match-hint match';
          matchHint.textContent = '✓ Passwords match';
        } else {
          matchHint.className = 'pwd-match-hint mismatch';
          matchHint.textContent = '✕ Passwords do not match';
        }
      }

      confirmPwdInput.addEventListener('input', checkPasswordMatch);

      // Celebration Confetti
      window.triggerAuthSuccessCelebration = function (redirectUrl) {
        const emojis = ['✨', '💖', '🌸', '🪙', '✦', '⭐'];
        const cardRect = (authStage || document.body).getBoundingClientRect();
        const centerX = cardRect.left + cardRect.width / 2;
        const centerY = cardRect.top + cardRect.height / 2;

        for (let i = 0; i < 28; i++) {
          const p = document.createElement('div');
          p.className = 'success-confetti-particle';
          p.textContent = emojis[i % emojis.length];
          const angle = (i / 28) * 2 * Math.PI;
          const dist = 90 + Math.random() * 180;
          const dx = Math.cos(angle) * dist + 'px';
          const dy = Math.sin(angle) * dist + 'px';
          const dr = (Math.random() * 720 - 360) + 'deg';
          p.style.setProperty('--dx', dx);
          p.style.setProperty('--dy', dy);
          p.style.setProperty('--dr', dr);
          p.style.left = centerX + 'px';
          p.style.top = centerY + 'px';
          document.body.appendChild(p);
          setTimeout(() => p.remove(), 1000);
        }

        setTimeout(() => {
          window.location.href = redirectUrl || 'dashboard.html';
        }, 800);
      };

      // Registration Form Submission
      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        showStatus('');

        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const phone = phoneInput ? phoneInput.value.trim() : '';
        const password = pwdInput.value;
        const confirmPassword = confirmPwdInput.value;

        if (!name) {
          showStatus('Please enter your full name.', 'error');
          nameInput.focus();
          return;
        }

        if (!email || !email.includes('@') || !email.includes('.')) {
          showStatus('Please enter a valid email address.', 'error');
          emailInput.focus();
          return;
        }

        if (!password || password.length < 6) {
          showStatus('Password must be at least 6 characters long.', 'error');
          pwdInput.focus();
          return;
        }

        if (password !== confirmPassword) {
          showStatus('Passwords do not match. Please re-enter your password.', 'error');
          confirmPwdInput.focus();
          return;
        }

        if (!termsCheckbox.checked) {
          showStatus('Please accept the Terms & Privacy Policy to register.', 'error');
          termsCheckbox.focus();
          return;
        }

        setLoading(true);

        try {
          const result = await window.VanviAPI.auth.signup({
            name,
            email,
            password,
            phone: phone || undefined,
            identifier: email
          });

          if (result.success) {
            showStatus('Welcome to Vanvi Moments! +100 Coins added! Opening dashboard... 🌸', 'success');
            const redirectUrl = new URLSearchParams(location.search).get('redirect') || 'dashboard.html';
            window.triggerAuthSuccessCelebration(redirectUrl);
            return;
          }

          setLoading(false);

          if (result.error && (result.error.toLowerCase().includes('already exists') || result.error.toLowerCase().includes('registered'))) {
            showStatus(
              `${result.error} <a href="login.html?email=${encodeURIComponent(email)}">Sign In instead →</a>`,
              'error',
              true
            );
          } else {
            showStatus(result.error || 'Registration failed. Please check your information.', 'error');
          }
        } catch (err) {
          setLoading(false);
          showStatus('Network connection error. Please try again.', 'error');
        }
      });

      // Mount official Google Identity Services button into #gsiButtonContainer
      function mountGoogleBtn() {
        if (window.VanviGoogleAuth && window.VanviGoogleAuth.renderButton) {
          window.VanviGoogleAuth.renderButton('gsiButtonContainer', {
            theme: 'outline',
            size: 'large',
            shape: 'pill',
            text: 'continue_with',
            width: 290
          });
        }
      }
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', mountGoogleBtn);
      } else {
        mountGoogleBtn();
      }
      window.addEventListener('load', mountGoogleBtn);

    })();
  </script>
  <!-- GLOBAL VANVI NAVIGATION DOCK -->
  <script src="js/vanvi-navigation.js"></script>
</body>
</html>
