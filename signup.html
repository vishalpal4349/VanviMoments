<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem('vanvi_aesthetic_theme')||'clay';var f=localStorage.getItem('vanvi_font_pref')||'royal';document.documentElement.setAttribute('data-vanvi-theme',t);document.documentElement.setAttribute('data-vanvi-font',f);}catch(e){}})();</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5.0, user-scalable=yes" />
  <title>Create an Account | Vanvi Moments</title>
  <meta name="description" content="Join Vanvi Moments to craft and manage handcrafted celebration invitations." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vanvi-inner-light.css" />
  <link rel="stylesheet" href="vanvi-navigation.css" />
  <link rel="stylesheet" href="css/vanvi-global-experience.css" />

  <style>
    :root {
      --clay-bg-grad: radial-gradient(circle at 50% 25%, #f3ebff 0%, #e2d4fd 50%, #ccb8f6 100%);
      --clay-primary: #9471e4;
      --clay-primary-grad: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
      --clay-input-bg: #f7f2fc;
      --clay-text-dark: #2c1642;
      --clay-text-muted: #7b6694;
      --clay-shadow-card: 0 20px 48px rgba(110, 80, 168, 0.18), 0 4px 14px rgba(0, 0, 0, 0.03), inset 0 2px 2px #ffffff;
      --clay-shadow-inner: 0 4px 18px rgba(120, 90, 180, 0.06), inset 0 1.5px 1.5px #ffffff;
      --clay-shadow-btn: 0 6px 16px rgba(148, 113, 228, 0.35), 0 2px 0 #6e46be;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--clay-bg-grad);
      font-family: var(--font-sans);
      color: var(--clay-text-dark);
      overflow-x: hidden !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 10px;
      position: relative;
    }

    /* Ambient Floating Props */
    .clay-studio-props {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .clay-prop {
      position: absolute;
      user-select: none;
      filter: drop-shadow(0 8px 16px rgba(90, 60, 140, 0.12));
      opacity: 0.7;
    }
    .prop-cloud-1 { top: 6%; left: 8%; font-size: 30px; }
    .prop-cloud-2 { top: 8%; right: 8%; font-size: 32px; }
    .prop-heart-float { top: 24%; left: 10%; font-size: 18px; }
    .prop-star-float { top: 22%; right: 10%; font-size: 18px; }

    /* Smart Fixed Back Button */
    .clay-nav-back {
      position: fixed;
      top: 10px;
      left: 12px;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      min-height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 10px rgba(124, 58, 237, 0.1);
      color: #280b45;
      font-size: 11px;
      font-weight: 850;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .clay-nav-back:hover {
      transform: translateX(-2px);
      color: var(--clay-primary);
    }

    /* Mode Switcher Bar */
    .clay-mode-switch-wrap {
      width: 100%;
      max-width: 330px;
      display: flex;
      justify-content: center;
      margin-bottom: 5px;
      position: relative;
      z-index: 10;
    }
    .clay-mode-switch {
      display: inline-flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.95);
      padding: 2.5px;
      border-radius: 999px;
      box-shadow: 0 3px 12px rgba(124, 58, 237, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.95);
      gap: 2px;
    }
    .clay-mode-tab {
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      color: var(--clay-text-muted);
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .clay-mode-tab.active {
      background: var(--clay-primary);
      background-image: var(--clay-primary-grad);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(139, 92, 246, 0.35);
    }
    .clay-coins-tag {
      font-size: 8.5px;
      padding: 1px 4px;
      border-radius: 99px;
      background: #f59e0b;
      color: #fff;
      font-weight: 900;
    }

    /* Master Compact Floating Card (~330px STRICT on Laptop & Mobile) */
    .clay-phone-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 330px;
      background: #ffffff;
      border-radius: 26px;
      box-shadow: var(--clay-shadow-card);
      padding: 10px 12px 10px;
      margin: 0 auto;
      text-align: center;
      box-sizing: border-box;
      animation: authCardEnter 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes authCardEnter {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Top Greeting Section */
    .clay-header-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1px;
    }
    .clay-main-title {
      font-size: 17px;
      font-weight: 900;
      color: var(--clay-text-dark);
      letter-spacing: -0.3px;
      margin: 0;
      line-height: 1.15;
    }
    .clay-sub-text {
      font-size: 10.5px;
      color: var(--clay-text-muted);
      margin-top: 1px;
      font-weight: 600;
    }

    /* 3D Cute Clay Character */
    .clay-girl-stage {
      position: relative;
      width: 100%;
      max-width: 72px;
      margin: 0 auto -9px;
      z-index: 2;
    }
    .clay-girl-photo {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      border-radius: 20px 20px 0 0;
      filter: drop-shadow(0 6px 12px rgba(180, 70, 110, 0.16));
    }

    /* Elevated Inner White Clay Form Card */
    .clay-inner-card {
      position: relative;
      z-index: 4;
      background: #ffffff;
      border-radius: 18px;
      padding: 9px 10px 7px;
      box-shadow: var(--clay-shadow-inner);
      border: 1px solid rgba(243, 232, 255, 0.95);
    }

    /* Compact Inset Input Rows */
    .clay-field-row {
      margin-bottom: 5px;
      position: relative;
      text-align: left;
    }
    .clay-pill-input-box {
      width: 100%;
      height: 33px;
      background: var(--clay-input-bg);
      border-radius: 999px;
      box-shadow: inset 0 1.5px 3px rgba(124, 58, 237, 0.07);
      display: flex;
      align-items: center;
      padding: 1px 5px 1px 3px;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .clay-pill-input-box:focus-within {
      background: #ffffff;
      border-color: var(--clay-primary);
      box-shadow: 0 0 0 2.5px rgba(139, 92, 246, 0.2);
    }
    .clay-icon-circle {
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
      color: #ffffff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .clay-icon-circle svg {
      width: 11px;
      height: 11px;
    }
    .clay-native-input {
      flex: 1;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      padding: 0 6px;
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--clay-text-dark);
      min-width: 0;
    }
    .clay-native-input::placeholder {
      color: #a491bc;
      font-weight: 500;
      font-size: 11px;
    }
    .clay-pwd-toggle {
      background: transparent;
      border: none;
      font-size: 13px;
      color: #8c71aa;
      cursor: pointer;
      padding: 1px 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Two-column password layout for ultra-compact fit */
    .clay-pwd-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      margin-bottom: 5px;
    }

    /* Terms Wrap */
    .clay-terms-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 4px 2px 5px;
      font-size: 10px;
      color: var(--clay-text-muted);
      text-align: left;
      cursor: pointer;
    }
    .clay-terms-wrap input {
      accent-color: var(--clay-primary);
      width: 12px;
      height: 12px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .clay-terms-wrap a {
      color: var(--clay-primary);
      font-weight: 800;
      text-decoration: none;
    }

    /* Main Submit Button */
    .clay-btn-main {
      width: 100%;
      height: 34px;
      border-radius: 999px;
      background: var(--clay-primary-grad);
      color: #ffffff;
      border: none;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 850;
      cursor: pointer;
      box-shadow: var(--clay-shadow-btn);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s ease;
      margin-top: 2px;
    }
    .clay-btn-main:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(139, 92, 246, 0.4);
    }
    .clay-btn-main:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Loading Spinner */
    .btn-spinner {
      width: 13px;
      height: 13px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: inline-block;
      flex-shrink: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Status Alert Message */
    .form-status {
      margin-top: 4px;
      font-size: 10.5px;
      font-weight: 700;
      min-height: 12px;
      color: var(--clay-text-muted);
      padding: 3px 5px;
      border-radius: 6px;
      text-align: center;
    }
    .form-status.error {
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #fee2e2;
    }
    .form-status.success {
      color: #15803d;
      background: #f0fdf4;
      border: 1px solid #dcfce7;
    }

    /* Divider */
    .clay-divider-line {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 5px 0;
      color: #a491bc;
      font-size: 9.5px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .clay-divider-line::before,
    .clay-divider-line::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #eae2f5;
    }
    .clay-divider-line span {
      padding: 0 5px;
    }

    /* Official Google Mount Container (Compact) */
    .gsi-mount-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 2px 0 5px;
      width: 100%;
      min-height: 36px;
    }
    #gsiButtonContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 36px;
    }

    /* Footer Switch Link */
    .clay-footer-link {
      font-size: 11px;
      color: var(--clay-text-muted);
      font-weight: 600;
      margin-top: 3px;
    }
    .clay-footer-link a {
      color: var(--clay-primary);
      font-weight: 850;
      text-decoration: none;
      margin-left: 3px;
    }

    /* Confetti Particle */
    .success-confetti-particle {
      position: fixed;
      pointer-events: none;
      z-index: 100000;
      font-size: 16px;
      animation: confettiBurst 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }
    .clay-phone-card,
    .clay-mode-switch-wrap { max-width: 400px; }
    .clay-phone-card { width: min(100%, 400px); }
    .clay-inner-card { padding: 16px; }
    .clay-field-row { margin-bottom: 10px; }
    .clay-pill-input-box { height: 44px; min-width: 0; }
    .clay-pwd-grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .clay-pwd-grid > .clay-pill-input-box { min-width: 0; }
    .clay-btn-main { height: 46px; font-size: 14px; }
    #gsiButtonContainer.google-signin-status {
      width: min(100%, 320px);
      min-height: 0;
      margin: 0 auto;
      padding: 8px 10px;
      border: 1px solid #e9d5ff;
      border-radius: 12px;
      background: #faf5ff;
      color: #6b4f85;
      font-size: 11px;
      font-weight: 650;
      line-height: 1.45;
      text-align: center;
    }
    @media (max-height: 700px) {
      body { justify-content: flex-start; padding-top: 46px; padding-bottom: 24px; }
    }
  </style>
</head>

<body class="vanvi-auth-body" id="authBody">

  <!-- Ambient Floating Background Props -->
  <div class="clay-studio-props" aria-hidden="true">
    <div class="clay-prop prop-cloud-1">☁️</div>
    <div class="clay-prop prop-cloud-2">☁️</div>
    <div class="clay-prop prop-heart-float">💖</div>
    <div class="clay-prop prop-star-float">✨</div>
  </div>

  <!-- Smart Fixed Back Button -->
  <a class="clay-nav-back" href="javascript:void(0)" onclick="vanviGoBack('index.html')" aria-label="Back to home">
    <span class="back-arrow" aria-hidden="true">‹</span>
    <span>Back</span>
  </a>

  <!-- Mode Switcher -->
  <div class="clay-mode-switch-wrap">
    <nav class="clay-mode-switch" aria-label="Auth tabs">
      <a href="login.html" class="clay-mode-tab">
        <span>🔑</span>
        <span>Sign In</span>
      </a>
      <a href="signup.html" class="clay-mode-tab active" aria-current="page">
        <span>✨</span>
        <span>Sign Up</span>
        <span class="clay-coins-tag">Free account</span>
      </a>
    </nav>
  </div>

  <!-- Master Compact Phone Card (~330px wide centered) -->
  <main class="clay-phone-card" id="authStage" role="main">

    <!-- Top Greeting Section -->
    <header class="clay-header-top">
      <h1 class="clay-main-title" id="signupTitle">
        <span>Join Vanvi Moments</span>
      </h1>
      <p class="clay-sub-text">Create your free Vanvi Moments account ✨</p>
    </header>

    <!-- 3D Cute Clay Character -->
    <div class="clay-girl-stage" aria-hidden="true">
      <img src="assets/vanvi-clay-girl-signup.jpg" alt="Cute Vanvi Moments 3D Girl" class="clay-girl-photo" loading="eager" />
    </div>

    <!-- Elevated Inner White Clay Form Card -->
    <section class="clay-inner-card" aria-label="Sign up credentials">
      <form id="signupForm" novalidate>

        <!-- Full Name Field -->
        <div class="clay-field-row">
          <div class="clay-pill-input-box">
            <div class="clay-icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
            </div>
            <input class="clay-native-input" id="signupName" name="name" type="text" placeholder="Full Name" autocomplete="name" required aria-label="Full Name" />
          </div>
        </div>

        <!-- Email Address Field -->
        <div class="clay-field-row">
          <div class="clay-pill-input-box">
            <div class="clay-icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
              </svg>
            </div>
            <input class="clay-native-input" id="signupEmail" name="email" type="email" placeholder="Email Address" autocomplete="email" required aria-label="Email Address" />
          </div>
        </div>

        <!-- Compact Password Grid: Password & Confirm Password Side-by-Side -->
        <div class="clay-pwd-grid">
          <div class="clay-pill-input-box">
            <div class="clay-icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
              </svg>
            </div>
            <input class="clay-native-input" id="signupPassword" name="password" type="password" placeholder="Password" autocomplete="new-password" required aria-label="Password" />
          </div>

          <div class="clay-pill-input-box">
            <div class="clay-icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
              </svg>
            </div>
            <input class="clay-native-input" id="signupConfirmPassword" name="confirmPassword" type="password" placeholder="Confirm" autocomplete="new-password" required aria-label="Confirm Password" />
          </div>
        </div>

        <!-- Terms Acceptance Checkbox -->
        <label class="clay-terms-wrap">
          <input type="checkbox" id="agreeTerms" required />
          <span>I accept <a href="terms.html" target="_blank">Terms</a> &amp; <a href="privacy.html" target="_blank">Privacy</a></span>
        </label>

        <!-- Primary Submit Button -->
        <button class="clay-btn-main" type="submit" id="btnSignupSubmit">
          <span class="btn-spinner" id="signupSpinner" style="display:none;" aria-hidden="true"></span>
          <span id="signupBtnText">Create Account ✨</span>
        </button>

        <!-- Status Alert Message -->
        <p id="signupStatus" class="form-status" role="status" aria-live="polite" style="display:none;"></p>
      </form>

      <!-- Divider -->
      <div class="clay-divider-line">
        <span>or sign up with</span>
      </div>

      <!-- Real Official Google Sign-In Container -->
      <div class="gsi-mount-wrap">
        <div id="gsiButtonContainer"></div>
      </div>

      <!-- Bottom Switch Link -->
      <p class="clay-footer-link">
        Already have an account? <a href="login.html">Sign In</a>
      </p>
    </section>
  </main>

  <!-- Central Client API, Google Auth & Navigation Scripts -->
  <script src="js/vanvi-api.js?v=auth-zero-coins"></script>
  <script src="js/vanvi-google-auth.js?v=google-public-config"></script>
  <script src="js/vanvi-i18n.js"></script>

  <script>
    function vanviGoBack(fallbackUrl) {
      if (window.history.length > 1 && document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
        window.history.back();
      } else {
        window.location.href = fallbackUrl || 'index.html';
      }
    }

    (function () {
      'use strict';

      const form = document.getElementById('signupForm');
      const status = document.getElementById('signupStatus');
      const authStage = document.getElementById('authStage');
      const pwdInput = document.getElementById('signupPassword');
      const confirmPwdInput = document.getElementById('signupConfirmPassword');
      const nameInput = document.getElementById('signupName');
      const emailInput = document.getElementById('signupEmail');
      const termsCheckbox = document.getElementById('agreeTerms');
      const btnSubmit = document.getElementById('btnSignupSubmit');
      const spinner = document.getElementById('signupSpinner');
      const btnText = document.getElementById('signupBtnText');

      function showStatus(msg, type, isHtml) {
        if (!status) return;
        if (!msg) {
          status.style.display = 'none';
          status.textContent = '';
          return;
        }
        status.style.display = 'block';
        if (isHtml) status.innerHTML = msg;
        else status.textContent = msg;
        status.className = 'form-status ' + (type || '');
      }

      function setLoading(isLoading) {
        if (btnSubmit) btnSubmit.disabled = isLoading;
        if (spinner) spinner.style.display = isLoading ? 'inline-block' : 'none';
        if (btnText) btnText.textContent = isLoading ? 'Creating Account...' : 'Create Account ✨';
      }

      window.triggerAuthSuccessCelebration = function (redirectUrl) {
        const emojis = ['✨', '🪙', '✦', '⭐', '💫', '🌟'];
        const cardRect = (authStage || document.body).getBoundingClientRect();
        const centerX = cardRect.left + cardRect.width / 2;
        const centerY = cardRect.top + cardRect.height / 2;

        for (let i = 0; i < 20; i++) {
          const p = document.createElement('div');
          p.className = 'success-confetti-particle';
          p.textContent = emojis[i % emojis.length];
          const angle = (i / 20) * 2 * Math.PI;
          const dist = 70 + Math.random() * 120;
          const dx = Math.cos(angle) * dist + 'px';
          const dy = Math.sin(angle) * dist + 'px';
          const dr = (Math.random() * 720 - 360) + 'deg';
          p.style.setProperty('--dx', dx);
          p.style.setProperty('--dy', dy);
          p.style.setProperty('--dr', dr);
          p.style.left = centerX + 'px';
          p.style.top = centerY + 'px';
          document.body.appendChild(p);
          setTimeout(() => p.remove(), 850);
        }

        setTimeout(() => {
          window.location.href = redirectUrl || 'dashboard.html';
        }, 700);
      };

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        showStatus('');

        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const password = pwdInput.value;
        const confirmPassword = confirmPwdInput.value;

        if (!name || name.length < 2) {
          showStatus('Please enter your full name.', 'error');
          nameInput.focus();
          return;
        }

        if (!email || !email.includes('@') || !email.includes('.')) {
          showStatus('Please enter a valid email address.', 'error');
          emailInput.focus();
          return;
        }

        if (!password || password.length < 6) {
          showStatus('Password must be at least 6 characters.', 'error');
          pwdInput.focus();
          return;
        }

        if (password !== confirmPassword) {
          showStatus('Passwords do not match.', 'error');
          confirmPwdInput.focus();
          return;
        }

        if (!termsCheckbox.checked) {
          showStatus('Please accept Terms to register.', 'error');
          termsCheckbox.focus();
          return;
        }

        setLoading(true);

        try {
          const result = await window.VanviAPI.auth.signup({
            name,
            email,
            password,
            identifier: email
          });

          if (result.success) {
            showStatus('Welcome to Vanvi Moments! Opening dashboard... 🌸', 'success');
            const redirectUrl = new URLSearchParams(location.search).get('redirect') || 'dashboard.html';
            window.triggerAuthSuccessCelebration(redirectUrl);
            return;
          }

          setLoading(false);
          if (result.error && (result.error.toLowerCase().includes('already exists') || result.error.toLowerCase().includes('registered'))) {
            showStatus(
              `${result.error} <a href="login.html?email=${encodeURIComponent(email)}">Sign In instead →</a>`,
              'error',
              true
            );
          } else {
            showStatus(result.error || 'Registration failed.', 'error');
          }
        } catch (err) {
          setLoading(false);
          showStatus('Network connection error.', 'error');
        }
      });

      function mountGoogleBtn() {
        if (window.VanviGoogleAuth && window.VanviGoogleAuth.renderButton) {
          window.VanviGoogleAuth.renderButton('gsiButtonContainer', {
            theme: 'outline',
            size: 'medium',
            shape: 'pill',
            text: 'signup_with',
            width: 270
          });
        }
      }
      window.addEventListener('load', mountGoogleBtn);
      if (document.readyState === 'complete') mountGoogleBtn();

    })();
  </script>
  <!-- GLOBAL VANVI NAVIGATION DOCK -->
  <script src="js/vanvi-navigation.js"></script>
</body>
