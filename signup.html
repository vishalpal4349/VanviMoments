<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem('vanvi_aesthetic_theme')||'clay';var f=localStorage.getItem('vanvi_font_pref')||'royal';document.documentElement.setAttribute('data-vanvi-theme',t);document.documentElement.setAttribute('data-vanvi-font',f);}catch(e){}})();</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5.0, user-scalable=yes" />
  <title>Create an Account | Vanvi Moments</title>
  <meta name="description" content="Join Vanvi Moments to craft custom digital celebration invitations and receive 100 free celebration coins." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vanvi-inner-light.css" />
  <link rel="stylesheet" href="vanvi-navigation.css" />
  <link rel="stylesheet" href="css/vanvi-global-experience.css" />

  <!-- Google Identity Services Official Client -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --clay-bg: #ffd1dc;
      --clay-bg-grad: radial-gradient(circle at 50% 28%, #fff0f5 0%, #fed7e2 48%, #fba6c2 100%);
      --clay-card-bg: #ffffff;
      --clay-primary: #ec4899;
      --clay-primary-dark: #db2777;
      --clay-primary-glow: rgba(236, 72, 153, 0.4);
      --clay-badge-bg: #f472b6;
      --clay-input-bg: #fff1f5;
      --clay-text-dark: #3f1127;
      --clay-text-muted: #8d4f6c;
      --clay-shadow-card: 0 24px 60px rgba(180, 70, 110, 0.22), 0 8px 24px rgba(0, 0, 0, 0.04), inset 0 2px 3px #ffffff;
      --clay-shadow-inner: 0 14px 34px rgba(180, 70, 110, 0.12), inset 0 2px 2px #ffffff;
      --clay-shadow-btn: 0 10px 24px rgba(236, 72, 153, 0.42), 0 3px 0 #be185d, inset 0 2px 2px rgba(255, 255, 255, 0.8), inset 0 -2px 3px rgba(0, 0, 0, 0.16);
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--clay-bg-grad);
      font-family: var(--font-sans);
      color: var(--clay-text-dark);
      overflow-x: hidden !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 36px;
      position: relative;
    }

    /* Ambient 3D Studio Clay Background Props */
    .clay-studio-props {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .clay-prop {
      position: absolute;
      user-select: none;
      filter: drop-shadow(0 14px 28px rgba(140, 50, 80, 0.18));
      will-change: transform;
    }

    .prop-cloud-1 {
      top: 6%;
      left: 6%;
      font-size: 42px;
      animation: floatCloud 16s ease-in-out infinite alternate;
      opacity: 0.85;
    }
    .prop-cloud-2 {
      top: 12%;
      right: 7%;
      font-size: 48px;
      animation: floatCloud 20s ease-in-out infinite alternate -6s;
      opacity: 0.85;
    }
    .prop-heart-float {
      top: 30%;
      left: 8%;
      font-size: 26px;
      animation: floatHeart 12s ease-in-out infinite alternate;
    }
    .prop-star-float {
      top: 26%;
      right: 9%;
      font-size: 24px;
      animation: floatHeart 14s ease-in-out infinite alternate -4s;
    }

    .prop-potted-plant {
      bottom: 24px;
      left: max(20px, calc(50% - 390px));
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .prop-plant-leaves {
      font-size: 64px;
      line-height: 1;
      transform: translateY(12px);
      filter: drop-shadow(0 6px 12px rgba(46, 125, 50, 0.25));
    }
    .prop-plant-pot {
      width: 58px;
      height: 48px;
      background: linear-gradient(180deg, #ecd8be 0%, #d8be98 100%);
      border-radius: 6px 6px 18px 18px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12), inset 0 2px 2px #fff;
    }

    .prop-potted-flower {
      bottom: 24px;
      right: max(20px, calc(50% - 390px));
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .prop-flower-bloom {
      font-size: 58px;
      line-height: 1;
      transform: translateY(10px);
      filter: drop-shadow(0 6px 12px rgba(233, 30, 99, 0.25));
    }
    .prop-flower-pot {
      width: 54px;
      height: 44px;
      background: linear-gradient(180deg, #f8bbd0 0%, #f48fb1 100%);
      border-radius: 6px 6px 18px 18px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12), inset 0 2px 2px #fff;
    }

    @keyframes floatCloud {
      0% { transform: translateY(0) translateX(0); }
      100% { transform: translateY(-12px) translateX(16px); }
    }
    @keyframes floatHeart {
      0% { transform: translateY(0) rotate(0deg) scale(1); }
      100% { transform: translateY(-16px) rotate(12deg) scale(1.08); }
    }

    /* Fixed Back Button */
    .clay-nav-back {
      position: fixed;
      top: 18px;
      left: 20px;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 18px;
      min-height: 40px;
      border-radius: 999px;
      background: #ffffff;
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 8px 24px rgba(180, 70, 110, 0.15), inset 0 2px 2px #ffffff;
      color: #3f1127;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 850;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .clay-nav-back:hover {
      transform: translateX(-3px) scale(1.03);
      color: var(--clay-primary);
      box-shadow: 0 12px 28px rgba(180, 70, 110, 0.25);
    }
    .clay-nav-back .back-arrow {
      font-size: 18px;
      line-height: 1;
      font-weight: 900;
    }

    /* Top Mode Switcher Bar */
    .clay-mode-switch-wrap {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
      position: relative;
      z-index: 10;
    }
    .clay-mode-switch {
      display: inline-flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 4px;
      border-radius: 999px;
      box-shadow: 0 6px 18px rgba(180, 70, 110, 0.1), inset 0 1px 2px #fff;
      border: 1px solid rgba(255, 255, 255, 0.9);
      gap: 4px;
    }
    .clay-mode-tab {
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--clay-text-muted);
      text-decoration: none;
      transition: all 0.22s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .clay-mode-tab.active {
      background: var(--clay-primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.35);
    }
    .clay-coins-tag {
      font-size: 9.5px;
      padding: 1.5px 6px;
      border-radius: 99px;
      background: #f59e0b;
      color: #fff;
      font-weight: 900;
    }

    /* Master Compact Phone Card (~420px wide centered) */
    .clay-phone-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 38px;
      box-shadow: var(--clay-shadow-card);
      padding: 22px 18px 20px;
      margin: auto 0;
      text-align: center;
      overflow: hidden;
      transform: translateZ(0);
      animation: authCardEnter 0.42s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes authCardEnter {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Top Greeting Section */
    .clay-header-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2px;
    }
    .clay-heart-emblem {
      font-size: 22px;
      line-height: 1;
      margin-bottom: 4px;
      animation: heartBreathe 3s ease-in-out infinite alternate;
    }
    @keyframes heartBreathe {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }
    .clay-main-title {
      font-size: 25px;
      font-weight: 900;
      color: #9d174d;
      letter-spacing: -0.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .clay-rays {
      font-size: 16px;
      color: #f59e0b;
    }
    .clay-sub-text {
      font-size: 12.5px;
      color: var(--clay-text-muted);
      margin-top: 3px;
      font-weight: 600;
    }

    /* 3D Cute Clay Character */
    .clay-girl-stage {
      position: relative;
      width: 100%;
      max-width: 135px;
      margin: 0 auto -18px;
      z-index: 2;
    }
    .clay-girl-photo {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      border-radius: 36px 36px 0 0;
      filter: drop-shadow(0 12px 20px rgba(180, 70, 110, 0.2));
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .clay-girl-stage:hover .clay-girl-photo {
      transform: scale(1.03) translateY(-2px);
    }

    /* Inner Elevated White Clay Form Card */
    .clay-inner-card {
      position: relative;
      z-index: 4;
      background: #ffffff;
      border-radius: 32px;
      padding: 18px 16px 14px;
      box-shadow: var(--clay-shadow-inner);
      border: 1.5px solid rgba(254, 226, 235, 0.9);
    }

    /* Inset Input Rows */
    .clay-field-row {
      margin-bottom: 8px;
      position: relative;
      text-align: left;
    }
    .clay-pill-input-box {
      width: 100%;
      min-height: 45px;
      background: var(--clay-input-bg);
      border-radius: 999px;
      box-shadow: inset 0 2.5px 5px rgba(180, 70, 110, 0.08), inset 0 1px 2px rgba(0,0,0,0.04);
      display: flex;
      align-items: center;
      padding: 4px 8px 4px 6px;
      transition: all 0.2s ease;
      border: 1.5px solid transparent;
    }
    .clay-pill-input-box:focus-within {
      background: #ffffff;
      border-color: var(--clay-primary);
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.22), inset 0 1px 2px #fff;
    }
    .clay-icon-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%);
      color: #ffffff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(236, 72, 153, 0.32), inset 0 1px 2px rgba(255,255,255,0.7);
    }
    .clay-icon-circle svg {
      width: 16px;
      height: 16px;
    }
    .clay-native-input {
      flex: 1;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      padding: 0 11px;
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 600;
      color: var(--clay-text-dark);
      min-width: 0;
    }
    .clay-native-input::placeholder {
      color: #b58299;
      font-weight: 500;
    }
    .clay-pwd-toggle {
      background: transparent;
      border: none;
      font-size: 17px;
      color: #a26982;
      cursor: pointer;
      padding: 6px 10px;
      transition: transform 0.2s ease, color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .clay-pwd-toggle:hover {
      transform: scale(1.15);
      color: var(--clay-primary);
    }

    /* Live Password Strength Meter */
    .strength-meter-wrap {
      margin: -4px 6px 10px;
    }
    .strength-bar-track {
      display: flex;
      gap: 5px;
      height: 4px;
      width: 100%;
      margin-bottom: 5px;
    }
    .strength-bar-segment {
      flex: 1;
      height: 100%;
      background: #f1e2e8;
      border-radius: 99px;
      transition: background 0.3s ease;
    }
    .strength-text-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: var(--clay-text-muted);
    }
    .strength-score-label {
      font-weight: 800;
      text-transform: capitalize;
    }

    /* Password Match Status Pill */
    .pwd-match-hint {
      font-size: 11px;
      font-weight: 700;
      margin: -4px 6px 10px;
      display: none;
    }
    .pwd-match-hint.match {
      color: #15803d;
      display: block;
    }
    .pwd-match-hint.mismatch {
      color: #dc2626;
      display: block;
    }

    /* Terms Acceptance Checkbox */
    .clay-terms-wrap {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 8px 4px 10px;
      font-size: 11.5px;
      color: var(--clay-text-muted);
      cursor: pointer;
      text-align: left;
      line-height: 1.4;
      user-select: none;
    }
    .clay-terms-wrap input {
      accent-color: var(--clay-primary);
      width: 15px;
      height: 15px;
      margin-top: 1px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .clay-terms-wrap a {
      color: var(--clay-primary);
      font-weight: 800;
      text-decoration: underline;
    }

    /* Primary Action Button */
    .clay-btn-main {
      width: 100%;
      min-height: 46px;
      border-radius: 999px;
      background: linear-gradient(180deg, #f472b6 0%, #db2777 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.6);
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 850;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: var(--clay-shadow-btn);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .clay-btn-main:hover {
      transform: translateY(-2px) scale(1.015);
      box-shadow: 0 14px 28px rgba(236, 72, 153, 0.55), 0 4px 0 #be185d;
    }
    .clay-btn-main:active {
      transform: translateY(2px) scale(0.985);
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3), 0 1px 0 #be185d;
    }
    .clay-btn-main:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Loading Spinner */
    .btn-spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: inline-block;
      flex-shrink: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Status Alert Message */
    .form-status {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 700;
      min-height: 18px;
      color: var(--clay-text-muted);
      padding: 6px 10px;
      border-radius: 8px;
      transition: all 0.2s ease;
      text-align: center;
    }
    .form-status.error {
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #fee2e2;
    }
    .form-status.success {
      color: #15803d;
      background: #f0fdf4;
      border: 1px solid #dcfce7;
    }
    .form-status a {
      color: inherit;
      text-decoration: underline;
      font-weight: 850;
    }

    /* Divider */
    .clay-divider-line {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 10px 0 10px;
      color: #b58299;
      font-size: 11px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .clay-divider-line::before,
    .clay-divider-line::after {
      content: '';
      flex: 1;
      border-bottom: 1.5px solid #fed7e2;
    }
    .clay-divider-line span {
      padding: 0 10px;
    }

    /* Official Prominent Google Sign-Up Button */
    .btn-google-official {
      width: 100%;
      min-height: 44px;
      border-radius: 999px;
      background: #ffffff;
      border: 1.5px solid #fed7e2;
      box-shadow: 0 4px 14px rgba(180, 70, 110, 0.08), inset 0 1px 1px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 750;
      color: #374151;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      margin-bottom: 10px;
    }
    .btn-google-official:hover {
      transform: translateY(-2px);
      border-color: #4285F4;
      box-shadow: 0 8px 20px rgba(66, 133, 244, 0.18), inset 0 1px 1px #fff;
      color: #1f2937;
    }
    .btn-google-official:active {
      transform: translateY(1px);
    }
    .google-g-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* GIS Real Button Container */
    #gsiButtonContainer {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    /* Footer Switch Link */
    .clay-footer-link {
      font-size: 12.5px;
      color: var(--clay-text-muted);
      font-weight: 600;
    }
    .clay-footer-link a {
      color: var(--clay-primary);
      font-weight: 850;
      text-decoration: none;
      margin-left: 4px;
    }
    .clay-footer-link a:hover {
      text-decoration: underline;
    }

    /* Confetti Particle */
    .success-confetti-particle {
      position: fixed;
      pointer-events: none;
      z-index: 100000;
      font-size: 20px;
      animation: confettiBurst 0.9s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }
    @keyframes confettiBurst {
      0% { opacity: 1; transform: translate(0, 0) scale(0.5); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.4) rotate(var(--dr)); }
    }

    /* Responsive Adaptations */
    @media (max-width: 860px) {
      .prop-potted-plant,
      .prop-potted-flower {
        display: none !important;
      }
    }

    /* =========================================================
       SUPERIOR LAPTOP & MOBILE RESPONSIVE ENGINE (ZERO SCROLL FIT)
       ========================================================= */
    @media (max-width: 768px) {
      .prop-potted-plant,
      .prop-potted-flower,
      .floating-clay-star,
      .ambient-glow-orb {
        display: none !important;
      }
      .clay-stage-canvas {
        padding: 10px 8px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: clamp(8px, 2vh, 16px) 10px;
        min-height: 100vh;
        min-height: 100dvh;
        justify-content: center;
      }
      .clay-nav-back {
        top: 10px;
        left: 10px;
        padding: 5px 12px;
        min-height: 32px;
        font-size: 11.5px;
      }
      .clay-mode-switch-wrap {
        margin-bottom: 6px;
      }
      .clay-mode-switch {
        padding: 3px;
        gap: 3px;
      }
      .clay-mode-tab {
        padding: 5px 13px;
        font-size: 11.5px;
      }
      .clay-phone-card {
        max-width: 380px;
        width: 100%;
        padding: clamp(12px, 3.5vw, 18px) clamp(10px, 3vw, 16px) clamp(10px, 3vw, 14px);
        border-radius: 28px;
      }
      .clay-girl-stage {
        max-width: clamp(95px, 22vw, 130px) !important;
        margin: 0 auto -16px !important;
      }
      .clay-girl-photo {
        border-radius: 26px 26px 0 0;
      }
      .clay-main-title {
        font-size: clamp(19px, 4.8vw, 22px);
        margin-bottom: 2px;
      }
      .clay-sub-text {
        font-size: 11.5px;
        margin-bottom: 8px;
      }
      .clay-inner-card {
        padding: clamp(12px, 3vw, 16px) clamp(10px, 2.5vw, 14px) clamp(10px, 2.5vw, 12px);
        border-radius: 22px;
      }
      .clay-field-row {
        margin-bottom: 10px;
      }
      .clay-pill-input-box {
        height: 42px;
        border-radius: 12px;
      }
      .clay-icon-circle {
        width: 28px;
        height: 28px;
        margin-left: 8px;
      }
      .clay-native-input {
        font-size: 13.5px;
        padding: 0 10px 0 6px;
      }
      .clay-submit-btn {
        height: 44px;
        font-size: 13.5px;
        border-radius: 14px;
        margin-top: 6px;
      }
      .btn-google-official {
        height: 42px;
        font-size: 13px;
        border-radius: 14px;
      }
      .clay-form-divider {
        margin: 10px 0;
      }
      .clay-bottom-links {
        margin-top: 10px;
        font-size: 11.5px;
      }
    }

    /* Shorter phone screens (e.g. iPhone SE, compact Androids, landscape) */
    @media (max-height: 740px) and (max-width: 480px) {
      body {
        padding: 6px 8px;
      }
      .clay-mode-switch-wrap {
        margin-bottom: 4px;
      }
      .clay-phone-card {
        padding: 10px 10px 8px;
        border-radius: 24px;
      }
      .clay-girl-stage {
        max-width: 85px !important;
        margin: 0 auto -12px !important;
      }
      .clay-main-title {
        font-size: 18px;
        margin-bottom: 0px;
      }
      .clay-sub-text {
        font-size: 11px;
        margin-bottom: 6px;
      }
      .clay-inner-card {
        padding: 10px 10px 8px;
        border-radius: 18px;
      }
      .clay-field-row {
        margin-bottom: 8px;
      }
      .clay-pill-input-box {
        height: 38px;
      }
      .clay-submit-btn {
        height: 40px;
        font-size: 13px;
        margin-top: 4px;
      }
      .btn-google-official {
        height: 38px;
        font-size: 12.5px;
      }
      .clay-form-divider {
        margin: 8px 0;
      }
      .clay-bottom-links {
        margin-top: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body class="vanvi-auth-body" id="authBody">

  <!-- Ambient 3D Studio Clay Background Props -->
  <div class="clay-studio-props" aria-hidden="true">
    <div class="clay-prop prop-cloud-1">☁️</div>
    <div class="clay-prop prop-cloud-2">☁️</div>
    <div class="clay-prop prop-heart-float">💖</div>
    <div class="clay-prop prop-star-float">✨</div>

    <!-- Potted Plant on Left (Desktop) -->
    <div class="clay-prop prop-potted-plant">
      <div class="prop-plant-leaves">🪴</div>
      <div class="prop-plant-pot"></div>
    </div>

    <!-- Potted Flower on Right (Desktop) -->
    <div class="clay-prop prop-potted-flower">
      <div class="prop-flower-bloom">🌸</div>
      <div class="prop-flower-pot"></div>
    </div>
  </div>

  <!-- Smart Fixed Back Button -->
  <a class="clay-nav-back" href="javascript:void(0)" onclick="vanviGoBack('index.html')" aria-label="Back to home">
    <span class="back-arrow" aria-hidden="true">‹</span>
    <span>Back</span>
  </a>

  <!-- Mode Switcher -->
  <div class="clay-mode-switch-wrap">
    <nav class="clay-mode-switch" aria-label="Auth tabs">
      <a href="login.html" class="clay-mode-tab">
        <span>🔑</span>
        <span>Sign In</span>
      </a>
      <a href="signup.html" class="clay-mode-tab active" aria-current="page">
        <span>✨</span>
        <span>Sign Up</span>
        <span class="clay-coins-tag">+100 🪙</span>
      </a>
    </nav>
  </div>

  <!-- Master Compact Phone Card (~420px wide centered) -->
  <main class="clay-phone-card" id="authStage" role="main">

    <!-- Top Greeting Section -->
    <header class="clay-header-top">
      <div class="clay-heart-emblem" aria-hidden="true">💖</div>
      <h1 class="clay-main-title" id="signupTitle">
        <span class="clay-rays">✨</span>
        <span>Create Account</span>
        <span class="clay-rays">✨</span>
      </h1>
      <p class="clay-sub-text">Join Vanvi Moments & earn 100 free coins</p>
    </header>

    <!-- 3D Cute Clay Character -->
    <div class="clay-girl-stage" aria-hidden="true">
      <img src="assets/vanvi-clay-girl-signup.jpg" alt="Cute Vanvi Moments 3D Girl" class="clay-girl-photo" loading="eager" />
    </div>

    <!-- Elevated Inner White Clay Form Card -->
    <section class="clay-inner-card" aria-label="Registration credentials">
      <form id="signupForm" novalidate>

        <!-- Full Name Field -->
        <div class="clay-field-row">
          <div class="clay-pill-input-box">
            <div class="clay-icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
            </div>
            <input class="clay-native-input" id="signupName" name="name" type="text" placeholder="Full Name" autocomplete="name" required aria-label="Full Name" />
          </div>
        </div>

        <!-- Email Address Field -->
        <div class="clay-field-row">
          <div class="clay-pill-input-box">
            <div class="clay-icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
              </svg>
            </div>
            <input class="clay-native-input" id="signupEmail" name="email" type="email" placeholder="Email Address" autocomplete="email" required aria-label="Email Address" />
          </div>
        </div>

        <!-- Mobile Number Field (Optional/Supported) -->
        <div class="clay-field-row">
          <div class="clay-pill-input-box">
            <div class="clay-icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
              </svg>
            </div>
            <input class="clay-native-input" id="signupPhone" name="phone" type="tel" placeholder="Mobile Number (optional)" autocomplete="tel" aria-label="Mobile Number" />
          </div>
        </div>

        <!-- Password Field -->
        <div class="clay-field-row">
          <div class="clay-pill-input-box">
            <div class="clay-icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
              </svg>
            </div>
            <input class="clay-native-input" id="signupPassword" name="password" type="password" placeholder="Create Password (min 6 chars)" autocomplete="new-password" required aria-label="Password" />
            <button type="button" class="clay-pwd-toggle" id="btnTogglePwd" title="Show/Hide Password" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <!-- Live Password Strength Meter -->
        <div class="strength-meter-wrap" id="strengthMeterWrap">
          <div class="strength-bar-track">
            <div class="strength-bar-segment" id="strengthSeg1"></div>
            <div class="strength-bar-segment" id="strengthSeg2"></div>
            <div class="strength-bar-segment" id="strengthSeg3"></div>
          </div>
          <div class="strength-text-row">
            <span>Strength: <span class="strength-score-label" id="strengthLabel">Enter password</span></span>
            <span id="strengthHint">Min 6 characters</span>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="clay-field-row">
          <div class="clay-pill-input-box">
            <div class="clay-icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
              </svg>
            </div>
            <input class="clay-native-input" id="signupConfirmPassword" name="confirmPassword" type="password" placeholder="Confirm Password" autocomplete="new-password" required aria-label="Confirm Password" />
            <button type="button" class="clay-pwd-toggle" id="btnToggleConfirmPwd" title="Show/Hide Confirm Password" aria-label="Toggle confirm password visibility">👁️</button>
          </div>
        </div>
        <div class="pwd-match-hint" id="pwdMatchHint"></div>

        <!-- Terms Acceptance Checkbox -->
        <label class="clay-terms-wrap">
          <input type="checkbox" id="agreeTerms" required />
          <span>I accept the <a href="terms.html" target="_blank">Terms of Service</a> & <a href="privacy.html" target="_blank">Privacy Policy</a></span>
        </label>

        <!-- Primary Submit Button -->
        <button class="clay-btn-main" type="submit" id="btnSignupSubmit">
          <span class="btn-spinner" id="signupSpinner" style="display:none;" aria-hidden="true"></span>
          <span id="signupBtnText">Create Account (+100 🪙) ✨</span>
        </button>

        <!-- Status Alert Message -->
        <p id="signupStatus" class="form-status" role="status" aria-live="polite" style="display:none;"></p>
      </form>

      <!-- Divider -->
      <div class="clay-divider-line">
        <span>or sign up with</span>
      </div>

      <!-- Real Official Google Sign-Up Button -->
      <div id="gsiButtonContainer" style="display:none;"></div>

      <button type="button" class="btn-google-official" id="googleSignupBtn" title="Sign up with Google" aria-label="Sign up with Google">
        <svg class="google-g-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>Sign up with Google (+100 🪙)</span>
      </button>

      <!-- Bottom Switch Link -->
      <p class="clay-footer-link">
        Already have an account? <a href="login.html">Sign In</a>
      </p>
    </section>
  </main>

  <!-- Central Client API, Google Auth & Navigation Scripts -->
  <script src="js/vanvi-api.js"></script>
  <script src="js/vanvi-google-auth.js"></script>
  <script src="js/vanvi-i18n.js"></script>

  <script>
    // Universal safe back navigation helper
    function vanviGoBack(fallbackUrl) {
      if (window.history.length > 1 && document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
        window.history.back();
      } else {
        window.location.href = fallbackUrl || 'index.html';
      }
    }

    (function () {
      'use strict';

      const form = document.getElementById('signupForm');
      const status = document.getElementById('signupStatus');
      const googleBtn = document.getElementById('googleSignupBtn');
      const authStage = document.getElementById('authStage');
      const btnTogglePwd = document.getElementById('btnTogglePwd');
      const btnToggleConfirmPwd = document.getElementById('btnToggleConfirmPwd');
      const pwdInput = document.getElementById('signupPassword');
      const confirmPwdInput = document.getElementById('signupConfirmPassword');
      const nameInput = document.getElementById('signupName');
      const emailInput = document.getElementById('signupEmail');
      const phoneInput = document.getElementById('signupPhone');
      const termsCheckbox = document.getElementById('agreeTerms');
      const btnSubmit = document.getElementById('btnSignupSubmit');
      const spinner = document.getElementById('signupSpinner');
      const btnText = document.getElementById('signupBtnText');
      const matchHint = document.getElementById('pwdMatchHint');

      // Strength Meter Elements
      const seg1 = document.getElementById('strengthSeg1');
      const seg2 = document.getElementById('strengthSeg2');
      const seg3 = document.getElementById('strengthSeg3');
      const strengthLabel = document.getElementById('strengthLabel');
      const strengthHint = document.getElementById('strengthHint');

      function showStatus(msg, type, isHtml) {
        if (!status) return;
        if (!msg) {
          status.style.display = 'none';
          status.textContent = '';
          return;
        }
        status.style.display = 'block';
        if (isHtml) {
          status.innerHTML = msg;
        } else {
          status.textContent = msg;
        }
        status.className = 'form-status ' + (type || '');
      }

      function setLoading(isLoading) {
        if (btnSubmit) btnSubmit.disabled = isLoading;
        if (spinner) spinner.style.display = isLoading ? 'inline-block' : 'none';
        if (btnText) btnText.textContent = isLoading ? 'Creating account...' : 'Create Account (+100 🪙) ✨';
      }

      // Password Visibility Toggles
      btnTogglePwd?.addEventListener('click', () => {
        if (pwdInput.type === 'password') {
          pwdInput.type = 'text';
          btnTogglePwd.textContent = '🔒';
        } else {
          pwdInput.type = 'password';
          btnTogglePwd.textContent = '👁️';
        }
      });

      btnToggleConfirmPwd?.addEventListener('click', () => {
        if (confirmPwdInput.type === 'password') {
          confirmPwdInput.type = 'text';
          btnToggleConfirmPwd.textContent = '🔒';
        } else {
          confirmPwdInput.type = 'password';
          btnToggleConfirmPwd.textContent = '👁️';
        }
      });

      // Live Password Strength Calculation
      function checkPasswordStrength(val) {
        if (!val) {
          seg1.style.background = '#f1e2e8';
          seg2.style.background = '#f1e2e8';
          seg3.style.background = '#f1e2e8';
          strengthLabel.textContent = 'Enter password';
          strengthLabel.style.color = 'var(--clay-text-muted)';
          strengthHint.textContent = 'Min 6 characters';
          return 0;
        }

        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 8 && /[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
        if (/[0-9]/.test(val) && /[^A-Za-z0-9]/.test(val)) score++;

        if (score === 1) {
          seg1.style.background = '#ef4444';
          seg2.style.background = '#f1e2e8';
          seg3.style.background = '#f1e2e8';
          strengthLabel.textContent = 'Weak';
          strengthLabel.style.color = '#ef4444';
          strengthHint.textContent = 'Add uppercase & numbers';
        } else if (score === 2) {
          seg1.style.background = '#f59e0b';
          seg2.style.background = '#f59e0b';
          seg3.style.background = '#f1e2e8';
          strengthLabel.textContent = 'Fair';
          strengthLabel.style.color = '#d97706';
          strengthHint.textContent = 'Add a symbol (e.g. !@#$)';
        } else if (score >= 3) {
          seg1.style.background = '#10b981';
          seg2.style.background = '#10b981';
          seg3.style.background = '#10b981';
          strengthLabel.textContent = 'Strong ✨';
          strengthLabel.style.color = '#059669';
          strengthHint.textContent = 'Great password!';
        }

        return score;
      }

      pwdInput.addEventListener('input', () => {
        checkPasswordStrength(pwdInput.value);
        checkPasswordMatch();
      });

      function checkPasswordMatch() {
        const p1 = pwdInput.value;
        const p2 = confirmPwdInput.value;
        if (!p2) {
          matchHint.style.display = 'none';
          return;
        }
        if (p1 === p2) {
          matchHint.className = 'pwd-match-hint match';
          matchHint.textContent = '✓ Passwords match';
        } else {
          matchHint.className = 'pwd-match-hint mismatch';
          matchHint.textContent = '✕ Passwords do not match';
        }
      }

      confirmPwdInput.addEventListener('input', checkPasswordMatch);

      // Celebration Confetti
      window.triggerAuthSuccessCelebration = function (redirectUrl) {
        const emojis = ['✨', '💖', '🌸', '🪙', '✦', '⭐'];
        const cardRect = (authStage || document.body).getBoundingClientRect();
        const centerX = cardRect.left + cardRect.width / 2;
        const centerY = cardRect.top + cardRect.height / 2;

        for (let i = 0; i < 28; i++) {
          const p = document.createElement('div');
          p.className = 'success-confetti-particle';
          p.textContent = emojis[i % emojis.length];
          const angle = (i / 28) * 2 * Math.PI;
          const dist = 90 + Math.random() * 180;
          const dx = Math.cos(angle) * dist + 'px';
          const dy = Math.sin(angle) * dist + 'px';
          const dr = (Math.random() * 720 - 360) + 'deg';
          p.style.setProperty('--dx', dx);
          p.style.setProperty('--dy', dy);
          p.style.setProperty('--dr', dr);
          p.style.left = centerX + 'px';
          p.style.top = centerY + 'px';
          document.body.appendChild(p);
          setTimeout(() => p.remove(), 1000);
        }

        setTimeout(() => {
          window.location.href = redirectUrl || 'dashboard.html';
        }, 800);
      };

      // Registration Form Submission
      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        showStatus('');

        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const phone = phoneInput ? phoneInput.value.trim() : '';
        const password = pwdInput.value;
        const confirmPassword = confirmPwdInput.value;

        if (!name) {
          showStatus('Please enter your full name.', 'error');
          nameInput.focus();
          return;
        }

        if (!email || !email.includes('@') || !email.includes('.')) {
          showStatus('Please enter a valid email address.', 'error');
          emailInput.focus();
          return;
        }

        if (!password || password.length < 6) {
          showStatus('Password must be at least 6 characters long.', 'error');
          pwdInput.focus();
          return;
        }

        if (password !== confirmPassword) {
          showStatus('Passwords do not match. Please re-enter your password.', 'error');
          confirmPwdInput.focus();
          return;
        }

        if (!termsCheckbox.checked) {
          showStatus('Please accept the Terms of Service & Privacy Policy to register.', 'error');
          termsCheckbox.focus();
          return;
        }

        setLoading(true);

        try {
          const result = await window.VanviAPI.auth.signup({
            name,
            email,
            password,
            phone: phone || undefined,
            identifier: email
          });

          if (result.success) {
            showStatus('Welcome to Vanvi Moments! +100 Coins added! Opening dashboard... 🌸', 'success');
            const redirectUrl = new URLSearchParams(location.search).get('redirect') || 'dashboard.html';
            window.triggerAuthSuccessCelebration(redirectUrl);
            return;
          }

          setLoading(false);

          // Handle duplicate account with helpful sign-in link
          if (result.error && (result.error.toLowerCase().includes('already exists') || result.error.toLowerCase().includes('registered'))) {
            showStatus(
              `${result.error} <a href="login.html?email=${encodeURIComponent(email)}">Sign In instead →</a>`,
              'error',
              true
            );
          } else {
            showStatus(result.error || 'Registration failed. Please check your information.', 'error');
          }
        } catch (err) {
          setLoading(false);
          showStatus('Network connection error. Please try again.', 'error');
        }
      });

      // Google Sign-Up Action
      googleBtn?.addEventListener('click', function () {
        if (window.VanviGoogleAuth) {
          window.VanviGoogleAuth.signIn({
            onSuccess: (res) => {
              showStatus(`Welcome ${res.user.name}! 100 celebration coins unlocked! Opening dashboard... ✨`, 'success');
              const redirectUrl = new URLSearchParams(location.search).get('redirect') || 'dashboard.html';
              window.triggerAuthSuccessCelebration(redirectUrl);
            },
            onError: (err) => {
              showStatus(err.message || 'Google sign-up could not be completed.', 'error');
            }
          });
        }
      });

      // Attempt GIS button rendering into #gsiButtonContainer if supported
      window.addEventListener('load', () => {
        if (window.VanviGoogleAuth && window.VanviGoogleAuth.renderButton) {
          window.VanviGoogleAuth.renderButton('gsiButtonContainer', {
            theme: 'outline',
            size: 'large',
            shape: 'pill',
            text: 'signup_with',
            width: 340
          });
        }
      });

    })();
  </script>
  <!-- GLOBAL VANVI NAVIGATION DOCK -->
  <script src="js/vanvi-navigation.js"></script>
</body>
</html>
