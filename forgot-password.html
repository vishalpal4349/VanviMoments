<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem('vanvi_aesthetic_theme')||'clay';var f=localStorage.getItem('vanvi_font_pref')||'royal';document.documentElement.setAttribute('data-vanvi-theme',t);document.documentElement.setAttribute('data-vanvi-font',f);}catch(e){}})();</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5.0, user-scalable=yes" />
  <title>Reset Password | Vanvi Moments</title>
  <meta name="description" content="Securely reset your Vanvi Moments celebration account password with real-time verification." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vanvi-inner-light.css" />
  <link rel="stylesheet" href="vanvi-navigation.css" />
  <link rel="stylesheet" href="css/vanvi-global-experience.css" />

  <style>
    :root {
      --clay-bg-grad: radial-gradient(circle at 50% 25%, #f3ebff 0%, #e2d4fd 50%, #ccb8f6 100%);
      --clay-primary: #9471e4;
      --clay-primary-grad: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
      --clay-input-bg: #f7f2fc;
      --clay-text-dark: #2c1642;
      --clay-text-muted: #7b6694;
      --clay-shadow-card: 0 20px 48px rgba(110, 80, 168, 0.18), 0 4px 14px rgba(0, 0, 0, 0.03), inset 0 2px 2px #ffffff;
      --clay-shadow-inner: 0 4px 18px rgba(120, 90, 180, 0.06), inset 0 1.5px 1.5px #ffffff;
      --clay-shadow-btn: 0 6px 16px rgba(148, 113, 228, 0.35), 0 2px 0 #6e46be;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--clay-bg-grad);
      font-family: var(--font-sans);
      color: var(--clay-text-dark);
      overflow-x: hidden !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 10px;
      position: relative;
    }

    /* Ambient Floating Props */
    .clay-studio-props {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .clay-prop {
      position: absolute;
      user-select: none;
      filter: drop-shadow(0 8px 16px rgba(90, 60, 140, 0.12));
      opacity: 0.7;
    }
    .prop-cloud-1 { top: 6%; left: 8%; font-size: 30px; }
    .prop-cloud-2 { top: 8%; right: 8%; font-size: 32px; }
    .prop-heart-float { top: 24%; left: 10%; font-size: 18px; }
    .prop-star-float { top: 22%; right: 10%; font-size: 18px; }

    /* Smart Fixed Back Button */
    .clay-nav-back {
      position: fixed;
      top: 10px;
      left: 12px;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      min-height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 10px rgba(124, 58, 237, 0.1);
      color: #280b45;
      font-size: 11px;
      font-weight: 850;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .clay-nav-back:hover {
      transform: translateX(-2px);
      color: var(--clay-primary);
    }

    /* Master Compact Floating Card (~330px wide centered) */
    .clay-phone-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 330px;
      background: #ffffff;
      border-radius: 26px;
      box-shadow: var(--clay-shadow-card);
      padding: 10px 12px 10px;
      margin: 0 auto;
      text-align: center;
      box-sizing: border-box;
      animation: authCardEnter 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes authCardEnter {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Top Greeting Section */
    .clay-header-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1px;
    }
    .clay-main-title {
      font-size: 17px;
      font-weight: 900;
      color: var(--clay-text-dark);
      letter-spacing: -0.3px;
      margin: 0;
      line-height: 1.15;
    }
    .clay-sub-text {
      font-size: 10.5px;
      color: var(--clay-text-muted);
      margin-top: 1px;
      font-weight: 600;
    }

    /* 3D Cute Clay Character */
    .clay-girl-stage {
      position: relative;
      width: 100%;
      max-width: 72px;
      margin: 0 auto -9px;
      z-index: 2;
    }
    .clay-girl-photo {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      border-radius: 20px 20px 0 0;
      filter: drop-shadow(0 6px 12px rgba(107, 33, 168, 0.16));
    }

    /* Elevated Inner White Clay Form Card */
    .clay-inner-card {
      position: relative;
      z-index: 4;
      background: #ffffff;
      border-radius: 18px;
      padding: 9px 10px 7px;
      box-shadow: var(--clay-shadow-inner);
      border: 1px solid rgba(243, 232, 255, 0.95);
    }

    /* Inset Input Rows */
    .clay-field-row {
      margin-bottom: 6px;
      position: relative;
      text-align: left;
    }
    .clay-pill-input-box {
      width: 100%;
      height: 34px;
      background: var(--clay-input-bg);
      border-radius: 999px;
      box-shadow: inset 0 1.5px 3px rgba(124, 58, 237, 0.07);
      display: flex;
      align-items: center;
      padding: 1px 5px 1px 3px;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .clay-pill-input-box:focus-within {
      background: #ffffff;
      border-color: var(--clay-primary);
      box-shadow: 0 0 0 2.5px rgba(139, 92, 246, 0.2);
    }
    .clay-icon-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
      color: #ffffff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .clay-icon-circle svg {
      width: 12px;
      height: 12px;
    }
    .clay-native-input {
      flex: 1;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      padding: 0 6px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      color: var(--clay-text-dark);
      min-width: 0;
    }
    .clay-native-input::placeholder {
      color: #a491bc;
      font-weight: 500;
      font-size: 11.5px;
    }
    .clay-pwd-toggle {
      background: transparent;
      border: none;
      font-size: 13px;
      color: #8c71aa;
      cursor: pointer;
      padding: 2px 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Main Submit Button */
    .clay-btn-main {
      width: 100%;
      height: 35px;
      border-radius: 999px;
      background: var(--clay-primary-grad);
      color: #ffffff;
      border: none;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 850;
      cursor: pointer;
      box-shadow: var(--clay-shadow-btn);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 3px;
      transition: all 0.2s ease;
    }
    .clay-btn-main:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(139, 92, 246, 0.4);
    }
    .clay-btn-main:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Loading Spinner */
    .btn-spinner {
      width: 13px;
      height: 13px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: inline-block;
      flex-shrink: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Status Alert Message */
    .form-status {
      margin-top: 4px;
      font-size: 10.5px;
      font-weight: 700;
      min-height: 12px;
      color: var(--clay-text-muted);
      padding: 3px 5px;
      border-radius: 6px;
      text-align: center;
    }
    .form-status.error {
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #fee2e2;
    }
    .form-status.success {
      color: #15803d;
      background: #f0fdf4;
      border: 1px solid #dcfce7;
    }

    /* Step Wrappers */
    .reset-step-section {
      display: none;
    }
    .reset-step-section.active {
      display: block;
      animation: stepFade 0.2s ease-out;
    }
    @keyframes stepFade {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Footer Switch Link */
    .clay-footer-link {
      font-size: 11px;
      color: var(--clay-text-muted);
      font-weight: 600;
      margin-top: 6px;
    }
    .clay-footer-link a {
      color: var(--clay-primary);
      font-weight: 850;
      text-decoration: none;
      margin-left: 3px;
    }
  </style>
</head>

<body class="vanvi-auth-body" id="authBody">

  <!-- Ambient Floating Background Props -->
  <div class="clay-studio-props" aria-hidden="true">
    <div class="clay-prop prop-cloud-1">☁️</div>
    <div class="clay-prop prop-cloud-2">☁️</div>
    <div class="clay-prop prop-heart-float">💖</div>
    <div class="clay-prop prop-star-float">✨</div>
  </div>

  <!-- Smart Fixed Back Button -->
  <a class="clay-nav-back" href="javascript:void(0)" onclick="vanviGoBack('login.html')" aria-label="Back to login">
    <span class="back-arrow" aria-hidden="true">‹</span>
    <span>Back</span>
  </a>

  <!-- Master Compact Phone Card (~330px wide centered) -->
  <main class="clay-phone-card" id="authStage" role="main">

    <!-- Top Greeting Section -->
    <header class="clay-header-top">
      <h1 class="clay-main-title">
        <span>Password Recovery</span>
      </h1>
      <p class="clay-sub-text">Reset your celebration credentials</p>
    </header>

    <!-- 3D Cute Clay Character -->
    <div class="clay-girl-stage" aria-hidden="true">
      <img src="assets/vanvi-clay-girl-forgot.jpg" alt="Cute Vanvi Moments 3D Character" class="clay-girl-photo" loading="eager" />
    </div>

    <!-- Elevated Inner White Clay Form Card -->
    <section class="clay-inner-card" aria-label="Password recovery credentials">

      <!-- STEP 1: Enter Email or Mobile -->
      <div class="reset-step-section active" id="step1Section">
        <form id="step1Form" novalidate>
          <div class="clay-field-row">
            <div class="clay-pill-input-box">
              <div class="clay-icon-circle" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
              </div>
              <input class="clay-native-input" id="recoveryIdentifier" name="identifier" type="text" placeholder="Email or Mobile" autocomplete="username" required aria-label="Email or Mobile" />
            </div>
          </div>

          <button class="clay-btn-main" type="submit" id="btnRequestOtp">
            <span class="btn-spinner" id="requestSpinner" style="display:none;" aria-hidden="true"></span>
            <span id="requestBtnText">Send Reset Code →</span>
          </button>
        </form>
      </div>

      <!-- STEP 2: Enter Verification OTP -->
      <div class="reset-step-section" id="step2Section">
        <form id="step2Form" novalidate>
          <p style="font-size:10.5px; color:var(--clay-text-muted); margin-bottom:6px;">
            Code sent to <strong id="displayTargetIdentifier" style="color:var(--clay-text-dark);"></strong>
          </p>

          <div class="clay-field-row">
            <div class="clay-pill-input-box">
              <div class="clay-icon-circle" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
              </div>
              <input class="clay-native-input" id="otpCodeInput" name="otp" type="text" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" placeholder="6-digit Code" autocomplete="one-time-code" required aria-label="6-digit verification code" style="letter-spacing: 3px; font-weight: 850; text-align: center; font-size:13px;" />
            </div>
          </div>

          <button class="clay-btn-main" type="submit" id="btnVerifyOtp">
            <span class="btn-spinner" id="verifySpinner" style="display:none;" aria-hidden="true"></span>
            <span id="verifyBtnText">Verify Code →</span>
          </button>
        </form>
      </div>

      <!-- STEP 3: Create New Password -->
      <div class="reset-step-section" id="step3Section">
        <form id="step3Form" novalidate>
          <div class="clay-field-row">
            <div class="clay-pill-input-box">
              <div class="clay-icon-circle" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
              </div>
              <input class="clay-native-input" id="newPasswordInput" name="newPassword" type="password" minlength="6" placeholder="New Password" autocomplete="new-password" required aria-label="New Password" />
              <button type="button" class="clay-pwd-toggle" id="btnToggleNewPwd" title="Show/Hide Password" aria-label="Toggle password visibility">👁️</button>
            </div>
          </div>

          <div class="clay-field-row">
            <div class="clay-pill-input-box">
              <div class="clay-icon-circle" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
              </div>
              <input class="clay-native-input" id="confirmPasswordInput" name="confirmPassword" type="password" minlength="6" placeholder="Confirm Password" autocomplete="new-password" required aria-label="Confirm Password" />
              <button type="button" class="clay-pwd-toggle" id="btnToggleConfirmPwd" title="Show/Hide Confirm Password" aria-label="Toggle confirm password visibility">👁️</button>
            </div>
          </div>

          <button class="clay-btn-main" type="submit" id="btnResetSubmit">
            <span class="btn-spinner" id="resetSpinner" style="display:none;" aria-hidden="true"></span>
            <span id="resetBtnText">Update Password ✨</span>
          </button>
        </form>
      </div>

      <!-- Status Alert Message -->
      <p id="forgotStatus" class="form-status" role="status" aria-live="polite" style="display:none;"></p>

      <!-- Bottom Switch Link -->
      <p class="clay-footer-link">
        Remember password? <a href="login.html">Sign In</a>
      </p>

      <!-- WhatsApp Concierge Instant Recovery Option -->
      <div style="margin-top:8px; padding-top:8px; border-top:1px dashed rgba(148, 113, 228, 0.25);">
        <a href="https://wa.me/917631442934?text=Namaste%20Vanvi%20Moments!%20I%20need%20help%20recovering%20my%20account%20password." target="_blank" rel="noopener" style="display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:#128c7e; text-decoration:none; padding:4px 10px; border-radius:12px; background:rgba(37, 211, 102, 0.1);">
          <span>💬</span> Instant Recovery via WhatsApp Concierge
        </a>
      </div>
    </section>
  </main>

  <!-- Central Client API & Navigation Scripts -->
  <script src="js/vanvi-api.js"></script>
  <script src="js/vanvi-i18n.js"></script>

  <script>
    function vanviGoBack(fallbackUrl) {
      if (window.history.length > 1 && document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
        window.history.back();
      } else {
        window.location.href = fallbackUrl || 'login.html';
      }
    }

    (function () {
      'use strict';

      const status = document.getElementById('forgotStatus');
      const step1Section = document.getElementById('step1Section');
      const step2Section = document.getElementById('step2Section');
      const step3Section = document.getElementById('step3Section');
      const displayTargetIdentifier = document.getElementById('displayTargetIdentifier');

      const step1Form = document.getElementById('step1Form');
      const step2Form = document.getElementById('step2Form');
      const step3Form = document.getElementById('step3Form');

      const recoveryInput = document.getElementById('recoveryIdentifier');
      const otpInput = document.getElementById('otpCodeInput');
      const newPwdInput = document.getElementById('newPasswordInput');
      const confirmPwdInput = document.getElementById('confirmPasswordInput');

      const btnRequestOtp = document.getElementById('btnRequestOtp');
      const requestSpinner = document.getElementById('requestSpinner');
      const requestBtnText = document.getElementById('requestBtnText');

      const btnVerifyOtp = document.getElementById('btnVerifyOtp');
      const verifySpinner = document.getElementById('verifySpinner');
      const verifyBtnText = document.getElementById('verifyBtnText');

      const btnResetSubmit = document.getElementById('btnResetSubmit');
      const resetSpinner = document.getElementById('resetSpinner');
      const resetBtnText = document.getElementById('resetBtnText');

      const btnToggleNewPwd = document.getElementById('btnToggleNewPwd');
      const btnToggleConfirmPwd = document.getElementById('btnToggleConfirmPwd');

      let currentIdentifier = '';
      let verifiedOtp = '';

      function showStatus(msg, type) {
        if (!status) return;
        if (!msg) {
          status.style.display = 'none';
          status.textContent = '';
          return;
        }
        status.style.display = 'block';
        status.textContent = msg;
        status.className = 'form-status ' + (type || '');
      }

      btnToggleNewPwd?.addEventListener('click', () => {
        if (newPwdInput.type === 'password') {
          newPwdInput.type = 'text';
          btnToggleNewPwd.textContent = '🔒';
        } else {
          newPwdInput.type = 'password';
          btnToggleNewPwd.textContent = '👁️';
        }
      });

      btnToggleConfirmPwd?.addEventListener('click', () => {
        if (confirmPwdInput.type === 'password') {
          confirmPwdInput.type = 'text';
          btnToggleConfirmPwd.textContent = '🔒';
        } else {
          confirmPwdInput.type = 'password';
          btnToggleConfirmPwd.textContent = '👁️';
        }
      });

      step1Form?.addEventListener('submit', async function (e) {
        e.preventDefault();
        showStatus('');

        const idVal = recoveryInput.value.trim();
        if (!idVal) {
          showStatus('Please enter email or mobile.', 'error');
          recoveryInput.focus();
          return;
        }

        btnRequestOtp.disabled = true;
        requestSpinner.style.display = 'inline-block';
        requestBtnText.textContent = 'Sending...';

        try {
          const res = await window.VanviAPI.auth.forgotPassword({ identifier: idVal });
          btnRequestOtp.disabled = false;
          requestSpinner.style.display = 'none';
          requestBtnText.textContent = 'Send Reset Code →';

          if (res.success) {
            currentIdentifier = idVal;
            displayTargetIdentifier.textContent = idVal;
            step1Section.classList.remove('active');
            step2Section.classList.add('active');
            showStatus(res.message || 'Code sent successfully!', 'success');
            otpInput.focus();
          } else {
            showStatus(res.error || 'Account not found.', 'error');
          }
        } catch (err) {
          btnRequestOtp.disabled = false;
          requestSpinner.style.display = 'none';
          requestBtnText.textContent = 'Send Reset Code →';
          showStatus('Network connection error.', 'error');
        }
      });

      step2Form?.addEventListener('submit', async function (e) {
        e.preventDefault();
        showStatus('');

        const otp = otpInput.value.trim();
        if (!otp || otp.length < 6) {
          showStatus('Please enter 6-digit code.', 'error');
          otpInput.focus();
          return;
        }

        btnVerifyOtp.disabled = true;
        verifySpinner.style.display = 'inline-block';
        verifyBtnText.textContent = 'Verifying...';

        try {
          const res = await window.VanviAPI.auth.verifyResetOtp({
            email: currentIdentifier,
            otp: otp
          });
          btnVerifyOtp.disabled = false;
          verifySpinner.style.display = 'none';
          verifyBtnText.textContent = 'Verify Code →';

          if (res.success) {
            verifiedOtp = otp;
            step2Section.classList.remove('active');
            step3Section.classList.add('active');
            showStatus('Code verified! Create new password.', 'success');
            newPwdInput.focus();
          } else {
            showStatus(res.error || 'Invalid or expired code.', 'error');
          }
        } catch (err) {
          btnVerifyOtp.disabled = false;
          verifySpinner.style.display = 'none';
          verifyBtnText.textContent = 'Verify Code →';
          showStatus('Network connection error.', 'error');
        }
      });

      step3Form?.addEventListener('submit', async function (e) {
        e.preventDefault();
        showStatus('');

        const newPwd = newPwdInput.value;
        const confirmPwd = confirmPwdInput.value;

        if (!newPwd || newPwd.length < 6) {
          showStatus('Password must be at least 6 characters.', 'error');
          newPwdInput.focus();
          return;
        }

        if (newPwd !== confirmPwd) {
          showStatus('Passwords do not match.', 'error');
          confirmPwdInput.focus();
          return;
        }

        btnResetSubmit.disabled = true;
        resetSpinner.style.display = 'inline-block';
        resetBtnText.textContent = 'Updating...';

        try {
          const res = await window.VanviAPI.auth.resetPassword({
            email: currentIdentifier,
            otp: verifiedOtp,
            newPassword: newPwd
          });

          btnResetSubmit.disabled = false;
          resetSpinner.style.display = 'none';
          resetBtnText.textContent = 'Update Password ✨';

          if (res.success) {
            showStatus('Password updated! Opening sign in... ✨', 'success');
            setTimeout(() => {
              window.location.href = 'login.html?reset=success';
            }, 800);
          } else {
            showStatus(res.error || 'Failed to update password.', 'error');
          }
        } catch (err) {
          btnResetSubmit.disabled = false;
          resetSpinner.style.display = 'none';
          resetBtnText.textContent = 'Update Password ✨';
          showStatus('Network connection error.', 'error');
        }
      });

    })();
  </script>

  <script src="js/vanvi-navigation.js"></script>
</body>
